<style>
/* Layout: phone-first app shell. A sticky scoreboard header, one scrolling column per tab,
   a fixed tab bar at the bottom, and details in bottom sheets. Dark first; light follows the phone. */
:root {
  color-scheme: dark;
  --bg: #0c0e12;          /* arena at night */
  --surface: #15181e;     /* cards and chart surface */
  --surface-2: #1e222a;   /* raised: chips, pressed rows, board cells */
  --line: #262b34;        /* hairlines and gridlines */
  --line-strong: #3a414d; /* baselines, swatch rings */
  --ink: #f2f4f7;
  --ink-2: #b8bfca;
  --muted: #8a919d;
  --live: #ff5a4f;
  --you: rgba(255, 255, 255, 0.055);
  --pos: #3987e5;         /* ahead of Vegas */
  --neg: #e66767;         /* behind Vegas */
  --p1: #3987e5; --p2: #d95926; --p3: #199e70; --p4: #c98500; --p5: #d55181;
  --font-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-md: 14px;
  --tabbar-h: 58px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef0f3; --surface: #fbfbfc; --surface-2: #eceff3; --line: #e1e4e9; --line-strong: #c3c9d1;
    --ink: #111418; --ink-2: #434a55; --muted: #616975; --live: #d93a30; --you: rgba(17, 20, 24, 0.045);
    --pos: #2a78d6; --neg: #e34948;
    --p1: #2a78d6; --p2: #eb6834; --p3: #1baf7a; --p4: #eda100; --p5: #e87ba4;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef0f3; --surface: #fbfbfc; --surface-2: #eceff3; --line: #e1e4e9; --line-strong: #c3c9d1;
  --ink: #111418; --ink-2: #434a55; --muted: #616975; --live: #d93a30; --you: rgba(17, 20, 24, 0.045);
  --pos: #2a78d6; --neg: #e34948;
  --p1: #2a78d6; --p2: #eb6834; --p3: #1baf7a; --p4: #eda100; --p5: #e87ba4;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
/* The page itself never scrolls. Header, scroller and tab bar are rows of a full-height column, so
   nothing is position: fixed; on iPhones fixed bars get dragged around when the page rubber-bands. */
html { -webkit-text-size-adjust: 100%; background: var(--bg); height: 100%; overscroll-behavior: none; }
body {
  margin: 0; height: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }

.scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 28px;
}

/* Header */
.top {
  flex: none; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.top-inner { max-width: 528px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 25px; letter-spacing: 0.02em; line-height: 1; }
.wordmark span { color: var(--muted); font-weight: 600; margin-left: 3px; }
.subline { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.live-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--surface);
  font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase;
}
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: pulse 1.6s ease-in-out infinite; flex: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.me-btn {
  width: 38px; height: 38px; border-radius: 50%; background: var(--surface); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 17px; box-shadow: inset 0 0 0 2px var(--pc, var(--line-strong));
}

/* Views */
.view { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border-radius: var(--r-md); }
.note { font-size: 12.5px; color: var(--muted); }
.empty { padding: 16px; font-size: 14px; color: var(--ink-2); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 12px; background: var(--ink); color: var(--bg);
  font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase;
}
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.linkbtn { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; font-weight: 600; font-size: 14px; color: var(--ink); }

/* Who's checking */
.who { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.who h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.who-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.who-top .linkbtn { min-height: 32px; color: var(--ink-2); font-size: 13.5px; }
.who-btns { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.who-btns button {
  min-height: 52px; border-radius: 10px; background: var(--surface-2); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 5px; font-size: 13px; font-weight: 650;
}
.who-btns button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }

/* Headline */
.headline { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); width: 100%; }
.headline .q { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.15; text-wrap: balance; }
.headline .dots { display: flex; gap: 5px; }
.headline .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
.headline .dots i.on { background: var(--ink-2); }

/* Standings board */
.board { overflow: hidden; }
.board .row, .board .bhead {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) 46px 44px 52px; align-items: center; column-gap: 6px;
  padding: 11px 12px; width: 100%;
}
.board .bhead { padding-block: 10px 4px; }
.colhead { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.prow + .prow { border-top: 1px solid var(--line); }
.prow.me { background: var(--you); }
.num { text-align: right; font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.rk { display: flex; flex-direction: column; line-height: 1.1; font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nm { display: flex; align-items: center; gap: 9px; min-width: 0; }
.nm > span { min-width: 0; }
.nm b { font-weight: 650; font-size: 16px; }
.nm small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pc); flex: none; display: inline-block; }
.pts { font-size: 28px; font-weight: 700; line-height: 1; display: inline-block; transform-origin: right center; }
.last { font-size: 18px; font-weight: 600; color: var(--ink-2); }
.pct { font-size: 18px; font-weight: 700; line-height: 1.1; }
.pct small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.rk .mv { margin-top: 2px; font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.youtag {
  font-style: normal; margin-left: 6px; font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: var(--ink); color: var(--bg); vertical-align: 2px;
}
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.3); } 100% { transform: scale(1); } }
.bump { animation: bump 0.7s ease-out; }

/* Picks inside a person's row */
.picks { padding: 0 12px 12px 42px; }
.pick {
  display: grid; grid-template-columns: minmax(0, 1fr) 46px 28px 40px 58px; column-gap: 6px; align-items: center;
  padding: 7px 0; width: 100%; border-top: 1px solid var(--line);
}
.pick.phead { border-top: 0; padding-block: 2px 4px; }
.pick .num { font-size: 16px; font-weight: 600; }
.pick .vs { color: var(--ink-2); }
.nx { text-align: right; font-size: 12px; line-height: 1.2; color: var(--ink-2); }
.nx b { display: block; font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--ink); }
.psum { padding-top: 8px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }

.tm { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.02em; white-space: nowrap; }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--tc); box-shadow: inset 0 0 0 1px var(--line-strong); flex: none; }
.side {
  font-family: var(--font-display); font-weight: 700; font-size: 12px; line-height: 1; padding: 2px 4px; margin-left: 4px;
  border-radius: 4px; border: 1px solid var(--line-strong); color: var(--ink-2);
}

/* Tonight */
.tonight-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.tonight-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; }
.tonight-head p { font-size: 13px; color: var(--muted); margin-top: 4px; }
.need { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.need b { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.need span { font-size: 13px; color: var(--muted); }
.game { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.game.mine { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.gtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 22px; }
.gstatus { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; white-space: nowrap; }
.gstatus .spr { color: var(--muted); font-weight: 600; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.tag.big { background: var(--ink); color: var(--bg); }
.teams { display: flex; flex-direction: column; gap: 4px; }
.tl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.tl .tn { color: var(--ink-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl .sc { font-family: var(--font-display); font-size: 25px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.tl.lead .sc { color: var(--ink); font-weight: 700; }
.oc { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px; align-items: center; }
.oc > span { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--surface-2); font-size: 13.5px; font-weight: 600; }
.pchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.pchip b { font-family: var(--font-display); font-size: 15px; }
.pchip.you { box-shadow: inset 0 0 0 1.5px var(--ink); }
.pchip.got { background: var(--ink); color: var(--bg); }
.pchip .via {
  font-style: normal; font-family: var(--font-display); font-size: 12.5px; font-weight: 700; letter-spacing: 0.03em;
  padding: 0 4px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--ink-2);
}
.pchip.got .via { border-color: currentColor; color: inherit; }
.nobody { font-size: 13px; color: var(--muted); }
.preview { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.prev-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; }
.prev-row .when { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.prev-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.prev-head b { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.ahead-list { display: flex; flex-direction: column; }
.ahead-list div { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ahead-list div:first-child { border-top: 0; }

/* Race */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { min-height: 38px; border-radius: 9px; font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--ink-2); text-align: center; }
.seg button[aria-selected="true"] { background: var(--surface-2); color: var(--ink); }
.mhelp { font-size: 13px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; }
.lg { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-2); min-height: 34px; }
.lg i { width: 16px; height: 2px; border-radius: 2px; background: var(--pc); }
.legend.focusing .lg { opacity: 0.5; }
.legend.focusing .lg.on { opacity: 1; color: var(--ink); font-weight: 650; }
.chart { padding: 8px 4px 4px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .zl { stroke: var(--line-strong); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; transition: opacity 0.2s; }
.chart .dim { opacity: 0.16; }
.chart .ring { stroke: var(--surface); stroke-width: 2; }
.chart .ld { stroke: var(--line-strong); stroke-width: 1; fill: none; }
.chart .lbl { fill: var(--ink-2); font-size: 11px; font-family: var(--font-body); }
.chart .lbl tspan.v { fill: var(--ink); font-weight: 700; }
.chart .cx { stroke: var(--ink-2); stroke-width: 1; }
.readout { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
.rd-date { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.rd-items { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.ri { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-2); }
.ri i { width: 14px; height: 2px; border-radius: 2px; background: var(--pc); }
.ri b { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.tblwrap { overflow-x: auto; }
details.tbl summary { cursor: pointer; font-size: 14px; font-weight: 600; min-height: 40px; display: flex; align-items: center; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th, .tbl td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.moments { list-style: none; margin: 0; padding: 0; overflow: hidden; }
.moments li + li { border-top: 1px solid var(--line); }
.moments button { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; width: 100%; padding: 11px 14px; font-size: 14.5px; }
.moments .md { color: var(--muted); font-family: var(--font-display); font-weight: 600; font-size: 15px; }

/* Draft */
.dboard { display: grid; grid-template-columns: 14px repeat(5, minmax(0, 1fr)); gap: 4px; }
.bh { font-size: 12px; font-weight: 650; color: var(--ink-2); display: flex; align-items: center; gap: 4px; min-width: 0; white-space: nowrap; overflow: hidden; padding-bottom: 2px; }
.bh .dot { width: 8px; height: 8px; }
.br { font-family: var(--font-display); font-weight: 600; color: var(--muted); font-size: 13px; display: flex; align-items: center; justify-content: center; }
.cell {
  border-radius: 8px; padding: 7px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0;
  background: var(--surface-2);
}
.cell b { font-family: var(--font-display); font-weight: 700; font-size: 15px; white-space: nowrap; }
.cell small { font-family: var(--font-display); font-size: 13px; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sh-p1 { background: color-mix(in oklab, var(--pos) 22%, var(--surface-2)); }
.sh-p2 { background: color-mix(in oklab, var(--pos) 40%, var(--surface-2)); }
.sh-p3 { background: color-mix(in oklab, var(--pos) 60%, var(--surface-2)); }
.sh-n1 { background: color-mix(in oklab, var(--neg) 22%, var(--surface-2)); }
.sh-n2 { background: color-mix(in oklab, var(--neg) 40%, var(--surface-2)); }
.sh-n3 { background: color-mix(in oklab, var(--neg) 60%, var(--surface-2)); }
.sh-p3 small, .sh-n3 small { color: var(--ink); }
.shade-key { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.shade-key i { width: 18px; height: 12px; border-radius: 3px; }
.shade-key i:not([class]) { background: var(--surface-2); }
.shade-key span:first-child { margin-right: 4px; }
.shade-key span:last-child { margin-left: 4px; }
.sect { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.sect h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; }
.sect p { font-size: 14px; color: var(--ink-2); }
.recap h2 { font-size: 24px; text-wrap: balance; }
.recap-lines { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; color: var(--ink-2); }
.aspire p { font-family: var(--font-display); font-size: 21px; font-weight: 600; line-height: 1.2; color: var(--ink); text-wrap: balance; }
.vrow { display: grid; grid-template-columns: minmax(0, 1fr) 44px 48px 48px; column-gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.vrow.vhd { border-top: 0; padding-block: 0 2px; }
.vrow .num { font-size: 18px; font-weight: 600; }
.vrow .odds { font-weight: 700; color: var(--ink); }
.vrow .was { color: var(--muted); }
.botrow { display: grid; grid-template-columns: minmax(0, 1fr) 40px 52px 44px; column-gap: 8px; align-items: center; width: 100%; padding: 8px 0; border-top: 1px solid var(--line); }
.botrow.bhd { border-top: 0; padding-block: 0 2px; }
.botrow .num { font-size: 18px; font-weight: 600; }
.botrow .diff { font-weight: 700; color: var(--ink); }
.botpicks { padding: 0 0 8px 19px; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.botpicks span b { font-family: var(--font-display); font-size: 14px; color: var(--ink); }
.cw { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.cw-side { display: flex; flex-direction: column; font-size: 13px; color: var(--ink-2); }
.cw-side b { font-family: var(--font-display); font-size: 26px; line-height: 1; color: var(--ink); }
.cw-side.r { text-align: right; }
.cwbar { display: flex; gap: 2px; height: 14px; }
.cwbar i { border-radius: 4px; background: var(--pc); }
.sb { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sb:first-of-type { border-top: 0; }
.sb .k { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.sb .v { font-family: var(--font-display); font-weight: 700; font-size: 18px; }

/* Bottom sheet */
.backdrop { position: fixed; inset: 0; z-index: 39; background: rgba(0, 0, 0, 0.5); opacity: 0; transition: opacity 0.25s; }
.backdrop.open { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; margin: 0 auto; max-width: 560px; max-height: 88vh;
  overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  transform: translateY(100%); transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet.open { transform: none; }
.sheet:focus { outline: none; }
.grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 0 auto 12px; }
.sh-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sh-title { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05; display: flex; align-items: center; gap: 8px; }
.sh-title .sw { width: 16px; height: 16px; }
.sh-sub { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.close { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; font-size: 18px; line-height: 1; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 9px 10px; }
.tile span { display: block; font-size: 11.5px; color: var(--muted); }
.tile b { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; }
.sh-sec { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.log { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.lgm { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; color: var(--muted); }
.lgm b {
  width: 100%; aspect-ratio: 1; max-width: 30px; border-radius: 6px; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 14px; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--ink-2);
}
.lgm b.earned { background: var(--pc); box-shadow: none; color: #fff; }
.nextlist { display: flex; flex-direction: column; }
.nextlist div { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.nextlist div:first-child { border-top: 0; }
.nextlist span:last-child { color: var(--muted); }
.rival { font-size: 14px; color: var(--ink-2); padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }

/* Replay */
.race-date { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; margin-top: 12px; font-variant-numeric: tabular-nums; }
.bars { position: relative; height: 200px; margin-top: 14px; }
.bar { position: absolute; left: 0; right: 0; top: 0; height: 32px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; align-items: center; transition: transform 0.35s ease; }
.bar .bn { font-size: 14px; font-weight: 650; }
.bar .bt { display: flex; align-items: center; gap: 6px; height: 22px; }
.bar .bt i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--pc); width: calc((100% - 46px) * var(--f, 0)); min-width: 2px; }
.bar .bv { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.race-ctl { display: flex; gap: 8px; margin-top: 10px; }

/* Tab bar */
.tabbar {
  flex: none; position: relative; z-index: 25; background: var(--bg); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar-inner { max-width: 528px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
.tabbar button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative;
  color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em;
}
.tabbar svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 2px; border-radius: 0 0 2px 2px; background: var(--ink); }
.tabbar .tdot { position: absolute; top: 8px; left: calc(50% + 9px); width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 2px var(--bg); }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 12px); z-index: 35;
  width: max-content; max-width: min(520px, calc(100vw - 32px)); transform: translate(-50%, 16px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 600;
  transition: opacity 0.2s, transform 0.2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div>
      <div class="wordmark">W/L DRAFT<span>26–27</span></div>
      <div class="subline" id="dateline">Loading…</div>
    </div>
    <div class="top-actions">
      <span class="live-pill" id="livePill" hidden><i class="live-dot"></i><span id="liveCount"></span></span>
      <button class="me-btn" id="meBtn" type="button" aria-label="Choose who you are">?</button>
    </div>
  </div>
</header>
<main class="scroller" id="scroller">
  <div class="app">
    <section class="view" id="view-standings" aria-label="Standings"><p class="empty">Loading standings…</p></section>
