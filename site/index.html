          <div class="cw-side r"><b>${l}</b>${esc(PEOPLE[sl].name)} (L)</div></div>
        <p>Every Blazers game moves a point between ${esc(PEOPLE[sw].name)} and ${esc(PEOPLE[sl].name)}. ${w === l ? 'Dead even.' : `${esc(PEOPLE[w > l ? sw : sl].name)} leads by ${Math.abs(w - l)}.`}${nx ? ` Next: ${nx.away ? 'at' : 'vs'} ${esc(TEAMS[nx.opp].name)}, ${nx.today ? 'today' : esc(whenLabel(nx.tip))}.` : ''}</p></section>`;
    }

    const drafted = new Set(PEOPLE.flatMap((p) => p.picks.map((k) => k.team + k.side)));
    const undrafted = [];
    for (const t of Object.keys(TEAMS)) for (const sd of ['W', 'L']) if (!drafted.has(t + sd)) undrafted.push(pickStats(REC, t, sd));
    const ghost = undrafted.sort((a, b) => b.pts - a.pts || lineValue(b.team, b.side) - lineValue(a.team, a.side))[0];
    const allPicks = ROWS.flatMap((r) => r.picks);
    const beaten = allPicks.filter((k) => k.pts < ghost.pts).length;
    html += `<section class="sect card"><h2>The pick nobody made</h2>
      <p>${ghost.pts ? `<b>${ghost.team} ${ghost.side}</b> (${esc(TEAMS[ghost.team].city)} ${ghost.side === 'W' ? 'wins' : 'losses'}) would have ${ghost.pts} point${ghost.pts === 1 ? '' : 's'} by now, more than ${beaten} of the 30 picks you made.`
        : `<b>${ghost.team} ${ghost.side}</b> (${esc(TEAMS[ghost.team].city)} ${ghost.side === 'W' ? 'wins' : 'losses'}) was worth ${lineValue(ghost.team, ghost.side).toFixed(1)} by the Vegas lines and nobody took it. We'll see who regrets that.`}</p></section>`;

    if (FINALS.length) {
      const steal = allPicks.reduce((a, b) => (b.vs > a.vs ? b : a));
      const bust = allPicks.reduce((a, b) => (b.vs < a.vs ? b : a));
      const sb = (label, k) => `<button type="button" class="sb" data-team="${k.team}" data-side="${k.side}"><span class="k">${label}</span>
        <span>${teamChip(k.team)}${sideTag(k.side)} <span class="note">${esc(PEOPLE[k.owner].name)}, pick #${k.overall}</span></span><span class="v">${signed(k.vs)}</span></button>`;
      html += `<section class="sect card"><h2>Steal and bust</h2><div>${sb('Steal', steal)}${sb('Bust', bust)}</div>
        <p class="note">Measured against each pick's Vegas line, prorated to games played.</p></section>`;
    }
    html += `<details class="card how" data-keep="how"${opened.has('how') ? ' open' : ''}><summary class="how-sum"><h2>How this works</h2></summary><div class="sect">
      <p>The standings rank by Pct, points per game your six teams have played, so nobody looks better just because their teams have played more; the points and misses are under it. Today (or Last) is the points from today's games so far, or from the last day of games.</p>
      <p>Results and live scores come from ESPN. Preseason lines are ${esc(D.meta.linesSource)}; "vs Vegas" grades every pick against those, scaled down slightly because the posted lines add up to ${Object.values(TEAMS).reduce((a, t) => a + t.line, 0).toLocaleString()} wins and a season only has 1,230. The bots draft from the lines as posted. Title odds come from ${(D.meta.model.simsNow || 12000).toLocaleString()} simulations of the rest of the season, using each team's current win total from Kalshi's betting market, taken each morning. If the market is unavailable, each team's preseason line blended with its record stands in.</p>
      <p>A live game's chance to win is our own and uses three things only: the score, the time left and who has the ball (worked out from the last play; the orange dot). Nothing about the teams, their records or the betting line. It's the chance the current margin survives the rest of the game when the scoring left is treated as random, with a spread of 18.5 points over a full game that shrinks as time runs out (Hal Stern's 1994 random-walk model of NBA scores). 18.5 is the value that best predicted the winners of last season's 1,231 games from each quarter break: teams up 7 to 9 after three quarters, for example, come out at 80% and actually won 77%. Having the ball counts as half a possession, about half a point, rising to a full possession over the last 24 seconds, when it's likely the last shot. ESPN's free data has no shot clock.</p>
      <p class="note">Standings refresh every 15 minutes during game hours; scores on this page update every 30 seconds while games are on.</p></div></details>`;
    $('view-draft').innerHTML = html;
  }

  /* ---------- sheets ---------- */
  let lastFocus = null;
  function openSheet(html, after) {
    stopBox();
    if ($('sheet').hidden) lastFocus = document.activeElement;  // not a button inside the sheet being replaced
    $('sheetBody').innerHTML = html;
    $('sheet').hidden = false;
    $('backdrop').hidden = false;
    requestAnimationFrame(() => {
      $('sheet').classList.add('open');
      $('backdrop').classList.add('open');
      $('sheet').focus();
    });
    if (after) after();
  }
  function closeSheet() {
    stopReplay();
    stopBox();
    $('sheet').classList.remove('open');
    $('backdrop').classList.remove('open');
    setTimeout(() => {
      if ($('sheet').classList.contains('open')) return;
      $('sheet').hidden = true;
      $('backdrop').hidden = true;
      $('sheetBody').innerHTML = '';
    }, reduceMotion ? 0 : 280);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  const closeBtn = '<button type="button" class="close" data-close aria-label="Close">✕</button>';

  function openPick(team, side) {
    const owner = OWN[side][team];
    if (owner == null) return;
    const info = PEOPLE[owner].picks.find((k) => k.team === team && k.side === side);
    const k = pickStats(REC, team, side);
    const log = REC[team].log.slice(-10);
    const earned = (g) => (side === 'W') === g.won;
    const rival = OWN[side === 'W' ? 'L' : 'W'][team];
    const next = nextGames(team, 3);
    const lineTxt = side === 'W' ? `${TEAMS[team].line} wins` : `${TEAMS[team].line} wins, so ${82 - TEAMS[team].line} losses`;
    const fairTxt = TEAMS[team].fair ? ` Scaled so all 30 lines add up to a real season, that's ${lineValue(team, side).toFixed(1)} ${side === 'W' ? 'wins' : 'losses'}.` : '';
    openSheet(`<div class="sh-head"><div><h2 class="sh-title" id="sheetTitle">${teamChip(team)}${sideTag(side)}</h2>
        <p class="sh-sub">${esc(TEAMS[team].city)} ${esc(TEAMS[team].name)} ${side === 'W' ? 'wins' : 'losses'} · ${esc(PEOPLE[owner].name)}, pick #${info.overall} (round ${info.round})</p></div>${closeBtn}</div>
      <div class="tiles">
        <div class="tile"><span>Points</span><b>${k.pts}</b></div>
        <div class="tile"><span>vs Vegas</span><b>${signed(k.vs)}</b></div>
        <div class="tile"><span>82-game pace</span><b>${k.gp ? Math.round(k.pace) : '–'}</b></div>
        <div class="tile"><span>Team W-L</span><b>${k.w}-${k.l}</b></div>
      </div>
      <p class="note" style="margin-top:8px">Vegas line: ${lineTxt}.${fairTxt}${k.gp ? ` At that rate this pick would have ${(lineValue(team, side) / 82 * k.gp).toFixed(1)} points after ${k.gp} game${k.gp === 1 ? '' : 's'}.` : ''}</p>
      <div class="sh-sec"><h3 class="eyebrow">${log.length > 1 ? `Last ${log.length} games` : log.length ? 'Last game' : 'Games'}</h3>
        ${log.length ? `<div class="log" style="${pc(owner)}">${log.map((g) => `<button type="button" class="lgm" data-box="${esc(g.id)}" data-from="${team} ${side}" aria-label="${g.won ? 'Win' : 'Loss'} ${g.away ? 'at' : 'against'} ${esc(TEAMS[g.opp].name)}, ${esc(isoDay(g.day))}: box score"><b class="${earned(g) ? 'earned' : ''}">${g.won ? 'W' : 'L'}</b>${g.away ? '@' : ''}${esc(g.opp)}</button>`).join('')}</div>
        <p class="note">Filled squares earned ${esc(PEOPLE[owner].name)} a point. Tap one for its box score.</p>` : '<p class="note">No games yet.</p>'}</div>
      <div class="sh-sec"><h3 class="eyebrow">Coming up</h3><div class="nextlist">${next.map((n) => `<div><span>${n.away ? '@' : 'vs'} ${esc(TEAMS[n.opp].city)} ${esc(TEAMS[n.opp].name)}</span><span>${n.g && n.g.state === 'live' ? 'Live now' : n.today ? 'Today ' + esc(fmtTime.format(new Date(n.tip))) : esc(fmtWeekday.format(new Date(n.tip)) + ' ' + fmtTime.format(new Date(n.tip)))}</span></div>`).join('') || '<div><span>Nothing in the next 10 days</span></div>'}</div></div>
      ${rival != null ? `<div class="sh-sec"><p class="rival">${esc(PEOPLE[rival].name)} has ${team} ${side === 'W' ? 'L' : 'W'}. Every ${esc(TEAMS[team].name)} game moves a point between ${esc(PEOPLE[owner].name)} and ${esc(PEOPLE[rival].name)}.</p></div>` : ''}`);
  }

  function openWho() {
    openSheet(`<div class="sh-head"><h2 class="sh-title" id="sheetTitle">Who's checking?</h2>${closeBtn}</div>
      <p class="sh-sub">This phone remembers your choice. It highlights your row and shows what you need tonight.</p>
      <div class="who-btns" style="margin-top:14px">${PEOPLE.map((p, s) => `<button type="button" data-me="${s}" aria-pressed="${state.me === s}"><i class="dot" style="${pc(s)}"></i>${esc(p.name)}</button>`).join('')}</div>
      <button type="button" class="linkbtn" data-me="-1" style="margin-top:6px">Just browsing</button>`);
  }

  /* ---------- box scores: fetched from ESPN only when someone taps a game ---------- */
  const SUMMARY = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=';
  const BOX_LIVE = 10e3;  // ESPN's servers hold a box score about 9 seconds, so faster gains nothing
  const BOX_COLS = ['MIN', 'PTS', 'REB', 'AST', 'STL', 'BLK', 'TO', 'FG', '3PT', 'FT', 'PF', '+/-'];
  const PLAYS = 15;
  const summaries = new Map();  // game id -> { data, at }: the latest parsed summary, for box scores and card stories
  let box = null;               // the box score on screen: { id, from, side, data, sig, failed, timer }

  function parseSummary(j) {
    const h = j.header && j.header.competitions && j.header.competitions[0];
    if (!h) throw new Error('no game in the summary');
    const t = (h.status && h.status.type) || {};
    const sides = {}, byId = {};
    for (const c of h.competitors || []) {
      const team = BY_ESPN[c.team && c.team.abbreviation];
      if (!team) continue;
      sides[c.homeAway] = { team, score: Number(c.score), lines: periodPoints(c) };
      byId[String((c.team && c.team.id) || c.id)] = team;
    }
    if (!sides.away || !sides.home) throw new Error('unknown teams in the summary');
    const players = {};
    for (const p of (j.boxscore && j.boxscore.players) || []) {
      const team = BY_ESPN[p.team && p.team.abbreviation];
      const s = p.statistics && p.statistics[0];
      if (!team || !s) continue;
      const labels = s.labels || [];
      const cols = (row) => BOX_COLS.map((k) => (row && labels.includes(k) && row[labels.indexOf(k)] != null ? String(row[labels.indexOf(k)]) : ''));
      players[team] = {
        rows: (s.athletes || []).map((a) => ({
          name: (a.athlete && (a.athlete.shortName || a.athlete.displayName)) || '',
          starter: !!a.starter, dnp: !!a.didNotPlay || !(a.stats && a.stats.length), reason: a.reason || '', stats: cols(a.stats),
        })),
        totals: cols(s.totals),
      };
    }
    // The latest plays, newest first, without the substitutions.
    const plays = (j.plays || []).slice(-4 * PLAYS)
      .filter((p) => p.text && !(p.type && /substitution/i.test(p.type.text || '')))
      .slice(-PLAYS).reverse()
      .map((p) => ({
        when: `${p.period && p.period.number ? periodName(p.period.number) : ''} ${(p.clock && p.clock.displayValue) || ''}`.trim(),
        team: byId[String(p.team && p.team.id)] || null,
        text: p.text,
        score: p.scoringPlay ? [Number(p.awayScore), Number(p.homeScore)] : null,
      }));
    const sideOf = (team) => (team === sides.away.team ? 0 : team === sides.home.team ? 1 : null);
    // Team totals by side, for the story.
    const stats = [null, null];
    for (const tm of (j.boxscore && j.boxscore.teams) || []) {
      const s = sideOf(BY_ESPN[tm.team && tm.team.abbreviation]);
      if (s == null) continue;
      const v = {};
      for (const x of tm.statistics || []) v[x.name] = x.displayValue;
      const pair = (k) => String(v[k] || '').split('-').map(Number);
      const [fgm, fga] = pair('fieldGoalsMade-fieldGoalsAttempted'), [tpm, tpa] = pair('threePointFieldGoalsMade-threePointFieldGoalsAttempted');
      stats[s] = { fgm, fga, tpm, tpa, fta: pair('freeThrowsMade-freeThrowsAttempted')[1], reb: Number(v.totalRebounds),
        to: Number(v.totalTurnovers), fb: Number(v.fastBreakPoints), maxLead: Number(v.largestLead) };
    }
    // Each side's top scorer, starters in foul trouble, and the players whose cold shooting is worth a
    // mention: starters among their team's three biggest shooters, or anyone taking 15 shots.
    const stars = [null, null], fouls = [], key = [new Set(), new Set()];
    const at = (r, k) => Number(r.stats[BOX_COLS.indexOf(k)]);
    const fga = (r) => Number(String(r.stats[BOX_COLS.indexOf('FG')]).split('-')[1]) || 0;
    for (const [team, P] of Object.entries(players)) {
      const s = sideOf(team);
      if (s == null) continue;
      const played = P.rows.filter((r) => !r.dnp);
      for (const r of played) {
        if (!stars[s] || at(r, 'PTS') > stars[s].pts) stars[s] = { name: lastName(r.name), pts: at(r, 'PTS'), reb: at(r, 'REB'), ast: at(r, 'AST') };
        if (r.starter && at(r, 'PF') >= 5) fouls.push({ side: s, name: lastName(r.name), pf: at(r, 'PF') });
      }
      played.sort((x, y) => fga(y) - fga(x)).forEach((r, i) => {
        if ((r.starter && i < 3) || fga(r) >= 15) key[s].add(lastName(r.name));
      });
    }
    const period = Number(h.status && h.status.period) || 0;
    const state = t.completed ? 'final' : t.state === 'in' ? 'live' : 'pre';
    const playSide = (p) => sideOf(byId[String(p.team && p.team.id)]);
    const wp = state === 'pre' ? { series: null, ball: null } : winSeries(j.plays || [], playSide, state === 'final');
    // ESPN's highlight clips (the adaptive stream, with the full-size file as a fallback) and its game recap.
    const https = (u) => (/^https:\/\//.test(u || '') ? u : '');
    const clips = (j.videos || []).map((v) => {
      const src = (v.links && v.links.source) || {};
      return { title: v.headline || '', secs: Number(v.duration) || 0, thumb: https(v.thumbnail),
        hls: https(src.HLS && src.HLS.href), mp4: https((src.HD && src.HD.href) || src.href) };
    }).filter((c) => c.hls || c.mp4);
    const longest = clips.reduce((m, c, i) => (c.secs > clips[m].secs ? i : m), 0);
    if (clips[longest] && clips[longest].secs >= 45) clips.unshift(clips.splice(longest, 1)[0]);  // ESPN's game package first
    clips.splice(12);
    const a = j.article;
    const recap = a && /recap/i.test(a.type || '') && a.story ? { title: a.headline || '', source: a.source || '', paras: storyParas(a.story) } : null;
    return {
      state, clock: clockText(h.status), tip: h.date, away: sides.away, home: sides.home,
      players, plays, period, pause: pauseOf(h.status), stats: stats[0] && stats[1] ? stats : null, stars, fouls,
      flow: playFlow(j.plays || [], playSide, period, (s, name) => key[s].has(name)),
      wp: wp.series, ball: wp.ball, clips, recap,
    };
  }

  function playsHtml(b) {
    if (!b.plays.length) return '<p class="note bx-msg">Plays show up once the game starts.</p>';
    return `<ol class="plays">${b.plays.map((p) => `<li class="${p.score ? 'scored' : ''}"><span class="pt">${esc(p.when)}</span>
      <span class="px">${p.team ? `<i class="sw" style="--tc:${teamColor(p.team)}" title="${esc(p.team)}"></i>` : ''}${esc(p.text)}</span>
      <span class="ps">${p.score && p.score.every(Number.isFinite) ? `${p.score[0]}–${p.score[1]}` : ''}</span></li>`).join('')}</ol>
      <p class="note">Last ${b.plays.length} plays, newest first; the score is ${esc(b.away.team)}–${esc(b.home.team)}. Substitutions left out.</p>`;
  }

  const dnpWhy = (r) => (/coach/i.test(r) ? 'coach’s decision' : /injur|ill/i.test(r) ? 'injured' : r ? r.toLowerCase() : 'out');

  function playersHtml(P) {
    const played = P ? P.rows.filter((r) => !r.dnp) : [];
    if (!played.length) return '<p class="note">Player stats show up once the game starts.</p>';
    const starters = played.filter((r) => r.starter), bench = played.filter((r) => !r.starter);
    const head = (label, cls) => `<tr class="${cls}"><th>${label}</th>${BOX_COLS.map((c) => `<th>${c}</th>`).join('')}</tr>`;
    const row = (r) => `<tr><th scope="row">${esc(r.name)}</th>${r.stats.map((v) => `<td>${esc(v)}</td>`).join('')}</tr>`;
    const out = P.rows.filter((r) => r.dnp);
    return `<div class="tblwrap bxwrap"><table class="bx"><thead>${head(starters.length ? 'Starters' : 'Players', '')}</thead><tbody>
      ${(starters.length ? starters : played).map(row).join('')}
      ${starters.length && bench.length ? head('Bench', 'sub') + bench.map(row).join('') : ''}
      <tr class="tot"><th scope="row">Team</th>${P.totals.map((v) => `<td>${esc(v)}</td>`).join('')}</tr></tbody></table></div>
      ${out.length ? `<p class="note">Did not play: ${out.map((r) => `${esc(r.name)} (${esc(dnpWhy(r.reason))})`).join(', ')}.</p>` : ''}`;
  }

  function boxHtml() {
    const g = slate.find((x) => x.id === box.id) || FINALS.find((x) => x.id === box.id) || {};
    const b = box.data;
    const away = b ? b.away.team : g.away, home = b ? b.home.team : g.home;
    if (!away || !home) return `<div class="sh-head"><h2 class="sh-title" id="sheetTitle">Box score</h2>${closeBtn}</div><p class="note">Couldn't find this game.</p>`;
    const on = b && b.state !== 'pre';
    // Until ESPN answers, show what the scoreboard already knows.
    const now = b || { state: g.state, clock: g.clock, tip: g.tip };
    const score = on ? [b.away.score, b.home.score] : !b && g.score && g.state !== 'pre' ? g.score : null;
    const pts = (i) => (score ? `<span>${score[i]}</span>` : '');
    const status = now.state === 'live' ? `<span class="gstatus"><i class="live-dot"></i>${esc(now.clock || 'Live')}</span>` : now.state === 'final' ? 'Final' : now.tip ? esc(fmtTime.format(new Date(now.tip))) : '';
    const when = g.day ? isoDay(g.day) : b ? fmtHeader.format(new Date(b.tip)) : '';
    const [fromTeam, fromSide] = (box.from || '').split(' ');
    let html = box.from ? `<button type="button" class="linkbtn bx-back" data-team="${esc(fromTeam)}" data-side="${esc(fromSide)}">‹ ${esc(box.from)}</button>` : '';
    html += `<div class="sh-head"><div><h2 class="sh-title bx-title" id="sheetTitle">${teamChip(away)}${pts(0)}<span class="bx-at">${score ? '–' : '@'}</span>${pts(1)}${teamChip(home)}</h2>
      <p class="sh-sub">${[status, esc(when)].filter(Boolean).join(' · ')}</p></div>${closeBtn}</div>`;
    if (on) {
      const n = Math.max(4, b.away.lines.length, b.home.lines.length);
      const row = (sd) => `<tr><th>${teamChip(b[sd].team)}${b.ball === (sd === 'home' ? 1 : 0) ? '<i class="ball" title="Has the ball"></i>' : ''}</th>${Array.from({ length: n }, (_, i) => `<td>${Number.isFinite(b[sd].lines[i]) ? b[sd].lines[i] : ''}</td>`).join('')}<td class="t">${b[sd].score}</td></tr>`;
      html += `<div class="tblwrap"><table class="ls"><thead><tr><th></th>${Array.from({ length: n }, (_, i) => `<th>${periodLabel(i)}</th>`).join('')}<th>T</th></tr></thead>
        <tbody>${row('away')}${row('home')}</tbody></table></div>`;
      const tale = gameStory(summaryView(b), 3);
      if (tale) html += `<p class="story bx-story">${esc(tale)}</p>`;
      html += wpChart(b);
    }
    const done = b && b.state === 'final';
    const homeWon = done && b.home.score > b.away.score;
    html += `<div class="bx-oc">${outcomeRow(away, home, done && !homeWon)}${outcomeRow(home, away, done && homeWon)}</div>`;
    if (!b) {
      html += box.failed ? '<p class="note bx-msg">Couldn\'t load the box score from ESPN.</p><button type="button" class="btn ghost" data-box-retry>Try again</button>'
        : '<p class="note bx-msg">Loading the box score…</p>';
    } else {
      const media = b.clips.length || b.recap;
      const tabs = [['away', TEAMS[b.away.team].name], ['home', TEAMS[b.home.team].name], ['plays', 'Plays'], ...(media ? [['recap', b.recap ? 'Recap' : 'Video']] : [])];
      const side = box.side === 'recap' && !media ? 'away' : box.side;
      html += `<div class="bx-tabs"><div class="seg bx-seg" role="tablist" aria-label="Box score">${tabs.map(([k, label]) => `<button type="button" role="tab" aria-selected="${k === side}" data-box-side="${k}">${esc(label)}</button>`).join('')}</div></div>`;
      html += side === 'plays' ? playsHtml(b) : side === 'recap' ? recapHtml(b) : playersHtml(b.players[b[side].team]);
    }
    html += `<p class="note bx-src">${b && b.state === 'live' ? `Updates every ${BOX_LIVE / 1000} seconds. ` : ''}<a href="https://www.espn.com/nba/game/_/gameId/${encodeURIComponent(box.id)}" target="_blank" rel="noopener">Full game on ESPN ›</a></p>`;
    return html;
  }

  function openBox(id, from) {
    const g = slate.find((x) => x.id === id) || FINALS.find((x) => x.id === id);
    const fromTeam = from ? from.split(' ')[0] : null;
    const mineAt = (t) => state.me != null && state.me >= 0 && (OWN.W[t] === state.me || OWN.L[t] === state.me);
    // Open on the team that brought you here: the pick you came from, else one of your teams.
    const side = g && (fromTeam ? g.home === fromTeam : mineAt(g.home) && !mineAt(g.away)) ? 'home' : 'away';
    openSheet('');
    const have = summaries.get(id);  // shown at once; a live game then refreshes
    box = { id, from: from || null, side, data: have ? have.data : null, failed: false, timer: 0 };
    renderBox();
    if (!box.data || box.data.state !== 'final') loadBox();
  }

  function renderBox() {
    if (!box || $('sheet').hidden) return;
    const wrap = document.querySelector('#sheetBody .bxwrap');
    const left = wrap ? wrap.scrollLeft : 0;  // keep the table where it was scrolled to
    $('sheetBody').innerHTML = boxHtml();
    const again = document.querySelector('#sheetBody .bxwrap');
    if (again) again.scrollLeft = left;
  }

  async function loadBox() {
    const b = box;
    if (!b) return;
    clearTimeout(b.timer);
    if (document.hidden) return;  // picked up again when the page is visible
    let changed = true;
    try {
      const r = await fetch(SUMMARY + encodeURIComponent(b.id), { cache: 'no-cache' });
      if (!r.ok) throw new Error('ESPN ' + r.status);
      const data = parseSummary(await r.json());
      if (box !== b) return;  // closed, or another game opened, while this loaded
      const sig = JSON.stringify(data);
      changed = sig !== b.sig;  // most refreshes bring nothing new; then the screen is left alone
      b.sig = sig;
      b.data = data;
      b.failed = false;
      summaries.set(b.id, { data, at: Date.now() });
    } catch (e) {
      if (box !== b) return;
      changed = !b.data;  // a failed refresh keeps the last good box score on screen
      b.failed = !b.data;
    }
    if (changed && b.side !== 'recap') renderBox();  // never redraw over a highlight that's playing
    if (b.data && b.data.state === 'live') b.timer = setTimeout(loadBox, BOX_LIVE);
  }

  function stopBox() {
    if (box) clearTimeout(box.timer);
    box = null;
  }

  /* ---------- game stories: a sentence or three on what has happened and why ---------- */
  const STORY_EVERY = 60e3;  // live cards re-read each game's play-by-play about once a minute
  const SUFFIX = /^(jr\.?|sr\.?|ii|iii|iv|v)$/i;
  // "Tyrese Maxey" or "T. Maxey" -> "Maxey"; "Jabari Smith Jr." -> "Smith Jr."
  function lastName(full) {
    const w = String(full || '').replace(/^[A-Z][a-z]?\.\s+/, '').trim().split(/\s+/);
    return w.length > 1 && SUFFIX.test(w[w.length - 1]) ? w.slice(-2).join(' ') : w[w.length - 1];
  }
  // Who shot and whether it went in, from ESPN's play text ("Tyrese Maxey makes 26-foot three point jumper").
  function shotBy(text) {
    let m = /^(.+?) (makes|misses) /.exec(text || '');
    if (m) return { name: m[1], made: m[2] === 'makes' };
    m = /^.+? blocks (.+?)'s /.exec(text || '');
    return m ? { name: m[1], made: false } : null;
  }
  const shotWord = (t) => (/three point/i.test(t) ? 'three' : /dunk/i.test(t) ? 'dunk' : /layup/i.test(t) ? 'layup'
    : /free throw/i.test(t) ? 'free throw' : /hook/i.test(t) ? 'hook shot' : 'jumper');
  const pthe = (p) => (p <= 4 ? `the ${ordinal(p)}` : p === 5 ? 'overtime' : `the ${ordinal(p - 4)} overtime`);

  // The game's flow from its plays: each side's largest deficit and who has scored since, the
  // current run and who scored it, lead changes, the last go-ahead basket, who has scored most this
  // period, and which key player has gone cold. sideOf(play) is 0 for the away team, 1 for home;
  // isKey(side, name) says whether a player's shooting is worth a mention.
  function playFlow(all, sideOf, period, isKey) {
    const scoring = [];
    let prev = [0, 0];
    for (const p of all) {
      if (!p.scoringPlay) continue;
      const now = [Number(p.awayScore), Number(p.homeScore)];
      if (!now.every(Number.isFinite)) continue;
      const d = [now[0] - prev[0], now[1] - prev[1]];
      prev = now;
      const s = d[0] > 0 ? 0 : d[1] > 0 ? 1 : null;
      if (s == null) continue;
      const sh = shotBy(p.text);
      scoring.push({ p, now, s, val: d[s], name: sh ? lastName(sh.name) : null });
    }
    const topOf = (list, s) => {
      const m = new Map();
      for (const x of list) if (x.s === s && x.name) m.set(x.name, (m.get(x.name) || 0) + x.val);
      let best = null;
      for (const [name, pts] of m) if (!best || pts > best.pts) best = { name, pts };
      return best;
    };
    const deficit = [0, 0], deficitAt = [-1, -1];
    let ahead = null, last = null, leadChanges = 0, goAhead = null;
    scoring.forEach((x, i) => {
      const [a, h] = x.now;
      if (h - a > deficit[0]) { deficit[0] = h - a; deficitAt[0] = i; }
      if (a - h > deficit[1]) { deficit[1] = a - h; deficitAt[1] = i; }
      const lead = a > h ? 0 : h > a ? 1 : null;
      if (lead != null && lead !== ahead) {
        const flip = last != null && lead !== last;  // took the lead from the other team, not just from a tie or 0-0
        if (flip) leadChanges++;
        goAhead = x.name ? { side: lead, flip, name: x.name, shot: shotWord(x.p.text), period: (x.p.period && x.p.period.number) || 0, clock: (x.p.clock && x.p.clock.displayValue) || '' } : null;
        last = lead;
      }
      ahead = lead;
    });
    // The run: back from the latest basket for as long as the other side has scored 4 or fewer.
    let run = null;
    const tally = [0, 0];
    for (let i = scoring.length - 1; i >= 0; i--) {
      tally[scoring[i].s] += scoring[i].val;
      if (Math.min(tally[0], tally[1]) > 4) break;
      const s = tally[0] >= tally[1] ? 0 : 1;
      if (tally[s] - tally[1 - s] >= 8) run = { side: s, pts: tally[s], opp: tally[1 - s], top: topOf(scoring.slice(i), s) };
    }
    // Field goals by player: in the second half once it has started, else the whole game.
    const half = period >= 3;
    const shots = [new Map(), new Map()];
    for (const p of all) {
      if (!p.shootingPlay || /free throw/i.test(p.text || '') || (half && !(p.period && p.period.number >= 3))) continue;
      const s = sideOf(p), sh = shotBy(p.text);
      if (s == null || !sh) continue;
      const name = lastName(sh.name), r = shots[s].get(name) || { made: 0, att: 0 };
      r.att++;
      if (sh.made) r.made++;
      shots[s].set(name, r);
    }
    const cold = shots.map((m, s) => {
      let worst = null;
      for (const [name, r] of m) {
        if (!isKey(s, name) || r.att < (half ? 7 : 9) || r.made / r.att > 0.3) continue;
        if (!worst || r.att - r.made > worst.att - worst.made) worst = { name, ...r };
      }
      return worst;
    });
    const thisPeriod = scoring.filter((x) => x.p.period && x.p.period.number === period);
    return {
      deficit, run, leadChanges, goAhead, half, cold, period,
      sinceTop: [0, 1].map((s) => (deficitAt[s] >= 0 ? topOf(scoring.slice(deficitAt[s] + 1), s) : null)),
      periodTop: [0, 1].map((s) => topOf(thisPeriod, s)),
    };
  }

  // ESPN's top-performer line ("35 PTS, 7 REB, 10 AST") as numbers.
  function starOf(p) {
    if (!p) return null;
    const m = {};
    for (const part of String(p.line || '').split(',')) {
      const [n, k] = part.trim().split(/\s+/);
      m[k] = Number(n);
    }
    return Number.isFinite(m.PTS) ? { name: lastName(p.name), pts: m.PTS, reb: m.REB || 0, ast: m.AST || 0 } : null;
  }

  const summaryView = (b) => (b.state === 'pre' ? null : {
    fin: b.state === 'final', period: b.period, pause: b.pause, teams: [b.away.team, b.home.team], score: [b.away.score, b.home.score],
    lines: [b.away.lines, b.home.lines], stats: b.stats, stars: b.stars, flow: b.flow, fouls: b.fouls,
  });

  // A card's story: the scoreboard's game, plus its play-by-play once fetched. The plays can be a
  // minute behind the score, so a run carries forward only while the other side stays quiet.
  function storyView(g, s) {
    if (!g.score || g.state === 'pre') return null;
    const v = { fin: g.state === 'final', period: g.period, pause: g.pause, teams: [g.away, g.home], score: g.score, lines: g.lines,
      stats: g.stats, stars: g.stars ? g.stars.map(starOf) : null, flow: null, fouls: [] };
    if (!s || s.away.team !== g.away || s.home.team !== g.home) return v;
    const since = [g.score[0] - s.away.score, g.score[1] - s.home.score];
    if (since.some((d) => d < 0)) return summaryView(s);  // the summary is the fresher of the two
    let run = s.flow.run;
    if (run) {
      const opp = run.opp + since[1 - run.side];
      run = opp > 4 ? null : { ...run, pts: run.pts + since[run.side], opp };
    }
    v.flow = { ...s.flow, run };
    v.fouls = s.fouls;
    if (s.stats) v.stats = v.stats ? v.stats.map((x, i) => ({ ...s.stats[i], ...x })) : s.stats;
    return v;
  }

  // Up to n sentences: what happened (a comeback, a run, a big quarter, a go-ahead basket), then why
  // (the stat gaps, and players running hot, cold or into foul trouble), then who (top scorers).
  function gameStory(v, n) {
    if (!v || !v.score || !v.score.every(Number.isFinite)) return '';
    const fin = v.fin, fl = v.flow, [a, h] = v.score;
    const L = a === h ? null : a > h ? 0 : 1, margin = Math.abs(a - h);

    const facts = [];

    const run = !fin && fl && fl.run && fl.run.pts - fl.run.opp >= 8 ? fl.run : null;
    const k = back != null ? back : L != null ? L : run ? run.side : null;  // whose story it is
    const lean = (s) => (k == null ? 0 : s === k ? 10 : -5);

    // What happened.
    if (back != null) {
      const d = deficit[back], by = fl && fl.sinceTop[back] && fl.sinceTop[back].pts >= 10 ? fl.sinceTop[back] : null;
      add('flow', 100 + d, (fin ? `${The(back)} came back from ${d} down` : L === back ? `${The(back)} have come back from ${d} down` : `${The(back)} have erased a ${d}-point deficit`)

    }
    if (run) {
      const top = run.top && run.top.pts >= 5 ? run.top : null;
      add('flow', 70 + run.pts - run.opp, `${The(run.side)} are on a ${run.pts}-${run.opp} run${top ? `, ${top.pts} of them from ${top.name}` : ''}`, top && top.name);
    }
    const P = v.lines ? Math.min(v.lines[0].length, v.lines[1].length) : 0;
    let big = null;
    for (let i = 0; P >= 2 && i < P; i++) {  // with one quarter played, its score is the whole score
      const x = v.lines[0][i], y = v.lines[1][i];
      if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
      const playing = !fin && !v.pause && i + 1 === v.period;
      const d = Math.abs(x - y);
      if (d < (playing ? 8 : 10)) continue;
      const w = (playing ? 50 : 40) + d;

    }
    if (big) {
      const pt = fl && fl.period === v.period && fl.periodTop[big.s];
      const top = big.playing && pt && pt.pts >= 8 ? pt : null;
      const p = big.i + 1, quarter = p <= 4 ? `${['first', 'second', 'third', 'fourth'][p - 1]} quarter` : null;
      // A quarter won by the team now well ahead is where it took control (or, at the end, pulled away).
      const decisive = quarter && big.s === L && margin >= 6;
      add('flow', big.w, big.playing ? `${The(big.s)} are outscoring ${the(1 - big.s)} ${big.hi}-${big.lo} in ${pthe(p)}${top ? `, ${top.name} with ${top.pts}` : ''}`
        : decisive ? `${The(big.s)} ${fin && p === P ? 'pulled away' : 'took control'} with a ${big.hi}-${big.lo} ${quarter}`
          : `${The(big.s)} won ${pthe(p)} ${big.hi}-${big.lo}`, top && top.name);
    }
    const most = L != null && v.stats && v.stats[L] ? v.stats[L].maxLead : null;
    if (L != null && back == null && margin >= 12 && most >= margin) {
      const star = v.stars && v.stars[L];
      add('flow', 45 + margin / 2, `${The(L)} ${fin ? 'led' : 'have led'} by as many as ${most}${star ? ` behind ${star.name}’s ${star.pts} points` : ''}`, star && star.name);
    }
    const ga = fl && fl.goAhead;
    if (ga && L === ga.side && (fin ? margin <= 10 : ga.flip && ga.period === v.period && v.period >= 4)) {
      const when = ga.clock === '0.0' ? ' at the buzzer' : ` with ${ga.clock} left${fin || ga.period !== v.period ? ' in ' + pthe(ga.period) : ''}`;
      add('flow', 55, `${ga.name}’s ${ga.shot}${when} put ${the(ga.side)} ahead${fin ? ' for good' : ''}`, ga.name);
    }
    if (margin <= 5 && (fin || v.period >= 4) && Math.max(deficit[0], deficit[1]) <= 9) {
      const lc = fl ? fl.leadChanges : 0;
      add('flow', 35, lc >= 3 ? `${fin ? 'There were' : 'There have been'} ${lc} lead changes` : `It ${fin ? 'was' : 'has been'} close all game`);
    }

    // Why.
    const st = v.stats;
    if (st && st[0] && st[1]) {
      for (const s of [0, 1]) {
        const o = 1 - s, A = st[s], B = st[o];
        if (A.tpm - B.tpm >= 4) add('why', 30 + 3 * (A.tpm - B.tpm) + lean(s), `${The(s)} ${fin ? 'made' : 'have made'} ${A.tpm} threes to ${B.tpm}`);
        if (B.tpa >= 15 && B.tpm / B.tpa <= 0.28) add('why', 28 + Math.round((0.3 - B.tpm / B.tpa) * 100) + lean(s), `${The(o)} ${fin ? 'went' : 'are'} ${B.tpm} of ${B.tpa} from three`);
        const pa = A.fgm / A.fga, pb = B.fgm / B.fga;
        if (A.fga >= 20 && B.fga >= 20 && pa - pb >= 0.07) add('why', 22 + Math.round((pa - pb) * 100) + lean(s), `${The(s)} ${fin ? 'outshot' : 'are outshooting'} ${the(o)} ${Math.round(pa * 100)}% to ${Math.round(pb * 100)}%`);
        if (A.fta - B.fta >= 10) add('why', 18 + A.fta - B.fta + lean(s), `${The(s)} ${fin ? 'took' : 'have taken'} ${A.fta} free throws to ${B.fta}`);
        if (A.reb - B.reb >= 10) add('why', 18 + A.reb - B.reb + lean(s), `${The(s)} ${fin ? 'outrebounded' : 'are outrebounding'} ${the(o)} ${A.reb}-${B.reb}`);
        if (B.to - A.to >= 6) add('why', 22 + 2 * (B.to - A.to) + lean(s), `${The(o)} ${fin ? 'had' : 'have'} ${B.to} turnovers to ${A.to}`);
        if (A.fb - B.fb >= 10) add('why', 18 + A.fb - B.fb + lean(s), `${The(s)} ${fin ? 'outscored' : 'are outscoring'} ${the(o)} ${A.fb}-${B.fb} on fast breaks`);
      }

    if (fl) {
      for (const s of [0, 1]) {
        const c = fl.cold[s];
        if (c) add('why', 34 + c.att + lean(1 - s), `${c.name} ${fin ? 'went' : 'is'} ${c.made} of ${c.att} from the field${fl.half ? (fin ? ' in the second half' : ' since halftime') : ''}`, c.name);

    for (const f of v.fouls || []) {
      if (f.pf >= 6) add('why', 32, `${f.name} fouled out`, f.name);

    (k != null ? [k, 1 - k] : [0, 1]).forEach((s, j) => {
      const p = v.stars && v.stars[s];
      if (!p || !(p.pts >= 10)) return;
      const line = [`${p.pts} points`, ...(p.reb >= 10 ? [`${p.reb} rebounds`] : []), ...(p.ast >= 10 ? [`${p.ast} assists`] : [])];
      add('who', 15 + p.pts / 2 - 5 * j, `${p.name} ${fin ? 'had' : 'has'} ${andList(line)}`, p.name);
    });

    // One fact of each kind, best first, never two about the same player.
    const out = [], used = new Set();
    const take = (group) => {
      const f = facts.filter((x) => x.group === group && !x.taken && !(x.who && used.has(x.who))).sort((x, y) => y.w - x.w)[0];
      if (!f) return false;
      f.taken = true;
      out.push(f);
      if (f.who) used.add(f.who);
      return true;
    };
    take('flow');
    take('why');
    if (out.length < n) take('who');
    while (out.length < n && take('why'));
    while (out.length < n && take('flow'));
    const order = { flow: 0, why: 1, who: 2 };  // what happened, then why, then who
    return out.slice(0, n).sort((x, y) => order[x.group] - order[y.group])
      .map((f) => f.text.charAt(0).toUpperCase() + f.text.slice(1) + '.').join(' ');
  }

  /* ---------- live win probability: from the score, the clock and the ball, nothing else ----------
     No betting line, no records, no home court. The final margin is the current lead plus normal noise
     with a standard deviation of 18.5 points over a full game, shrinking with the square root of the
     time left (Stern's 1994 random-walk model of NBA scoring, with neither team favored). 18.5 best
     predicted the winners of the 1,231 games of 2025-26 from each quarter break
     (scripts/calibrate_win_prob.py). The time left never counts as under 30 seconds, since the last
     possessions are lumpier than the formula. The team with the ball gets credit for half a
     possession's points (about 1.1 a possession), rising to a whole one as the game's last shot clock
     runs down. */
  const MARGIN_SD = 18.5, POSSESSION = 1.1;

    return x < 0 ? -y : y;

  function winProb(lead, minutesLeft, ball) {

    return 0.5 * (1 + erf((lead + edge) / (MARGIN_SD * Math.sqrt(Math.max(minutesLeft, 0.5) / 48)) / Math.SQRT2));
  }

  const clockMinutes = (c) => {
    const s = String(c || '0');

    const [m, sec] = s.split(':').map(Number);
    return (m || 0) + (sec || 0) / 60;

  function minutesLeft(period, clock, pause, tied) {
    let left = pause ? (period <= 4 ? (4 - period) * 12 : 0) : period <= 4 ? (4 - period) * 12 + clockMinutes(clock) : clockMinutes(clock);
    if (left <= 0 && tied) left = 5;
    return left;

  // Who has the ball after a play, from ESPN's play type and text: a made basket or a turnover gives it
  // to the other team, a rebound to the rebounder, a foul to the team fouled. Nobody has it while a shot
  // is in the air, after a jump ball or between periods. prev is the ball before; side the play's team.
  const TURNOVER = /turnover|traveling|shot clock|double dribble|out of bounds|step out|backcourt|palming|discontinue|second violation|offensive goaltending|kicked ball/;
  function ballAfter(prev, p, side) {
    const type = ((p.type && p.type.text) || '').toLowerCase(), text = (p.text || '').toLowerCase(), both = `${type} ${text}`;
    if (/end of (the )?(1st|2nd|3rd|4th|quarter|half|game|period|overtime)|end period|end game/.test(both)) return null;
    if (/substitution|timeout|replay|review|ejection|technical|delay of game/.test(both) || side == null) return prev;
    if (/free throw/.test(both)) {
      const m = /(\d) of (\d)/.exec(text);
      if (m && m[1] !== m[2]) return side;  // more free throws to come
      return p.scoringPlay ? 1 - side : null;  // a missed last free throw is a loose ball

      if (Number.isFinite(Number(p.homeScore))) h = Number(p.homeScore);

  // Who has the ball in a live game: from the scoreboard's last play, else the play-by-play if it's current.
  function liveBall(g) {

    if (g.ball != null) return g.ball;
    const have = summaries.get(g.id);
    const s = have && have.data;
    return s && s.state === 'live' && g.score && s.away.score === g.score[0] && s.home.score === g.score[1] ? s.ball : null;
  }
  function liveWin(g, ball) {

  // A live game's chances as a bar in the two teams' colors.
  function winBar(away, home, p) {
    return `<div class="wp"><span class="wpbar" aria-hidden="true"><i style="flex:${(1 - p).toFixed(3)};background:${teamColor(away)}"></i><i style="flex:${p.toFixed(3)};background:${teamColor(home)}"></i></span>
      <span class="wpl">${esc(chanceText(away, home, p))} to win</span></div>`;
  }
  // The chances through the game: the away team's side of the line on top, the home team's below.
  function wpChart(b) {
    const s = b.wp;

    const x = (m) => (m / end * W).toFixed(1), y = (p) => (p * H).toFixed(1);
    const line = s.map(([m, p], i) => `${i ? 'L' : 'M'}${x(m)},${y(p)}`).join('');
    const area = `${line}L${x(s[s.length - 1][0])},${H / 2}L0,${H / 2}Z`;
    const grid = [12, 24, 36, ...(end > 48 ? [48] : [])].map((m) => `<line class="wpg" x1="${x(m)}" x2="${x(m)}" y1="0" y2="${H}"/>`).join('');
    const p = s[s.length - 1][1];
    return `<div class="wpc"><div class="wpc-k"><span>${esc(b.away.team)}</span><span>${esc(b.home.team)}</span></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Chance to win through the game">
        <defs><clipPath id="wpTop"><rect width="${W}" height="${H / 2}"/></clipPath><clipPath id="wpBot"><rect y="${H / 2}" width="${W}" height="${H / 2}"/></clipPath></defs>
        <path class="wpa" d="${area}" fill="${teamColor(b.away.team)}" clip-path="url(#wpTop)"/><path class="wpa" d="${area}" fill="${teamColor(b.home.team)}" clip-path="url(#wpBot)"/>
        ${grid}<line class="wpm" x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}"/><path class="wpline" d="${line}"/></svg></div>
      <p class="note">Chance to win${b.state === 'live' ? ` right now: ${esc(chanceText(b.away.team, b.home.team, p))}` : ' through the game'}. From the score, the time left and who has the ball only; how it works is on the Draft tab.</p>`;
  }

  // The recap's paragraphs as plain text: ESPN sends HTML with player links, subheads and a few broken
  // characters. Parsing it as an inert document runs nothing, and only its text is kept.
  function storyParas(html) {
    const marked = String(html).replace(/<hl2>/gi, '\n\n## ').replace(/<\/hl2>/gi, '\n\n');
    const text = new DOMParser().parseFromString(marked, 'text/html').body.textContent || '';
    return text.replace(/[\u0080-\u009f�]/g, '').replace(/\s*--\s*(—\s*)?/g, ' — ')  // "PHILADELPHIA -- — Tyrese" -> "PHILADELPHIA — Tyrese"
      .split(/\n\s*\n/).map((p) => p.replace(/\s+/g, ' ').trim()).filter(Boolean);
  }
  const clipTime = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
  // Highlights play right here (an iPhone streams them at phone quality), then ESPN's recap story.
  function recapHtml(b) {
    const i = Math.min(box.clip || 0, Math.max(b.clips.length - 1, 0)), c = b.clips[i];
    let html = '';
    if (c) {
      html += `<div class="hl"><video id="hlVideo" controls playsinline preload="none"${c.thumb ? ` poster="${esc(c.thumb)}"` : ''}>${c.hls ? `<source src="${esc(c.hls)}" type="application/x-mpegURL">` : ''}${c.mp4 ? `<source src="${esc(c.mp4)}" type="video/mp4">` : ''}</video>
        <p class="hl-t">${esc(c.title)}</p></div>`;
      if (b.clips.length > 1) html += `<div class="clips">${b.clips.map((x, j) => `<button type="button" class="clip${j === i ? ' on' : ''}" data-clip="${j}">${x.thumb ? `<img src="${esc(x.thumb)}" alt="" loading="lazy">` : ''}<span>${esc(x.title)}</span><em>${clipTime(x.secs)}</em></button>`).join('')}</div>`;
    }
    if (b.recap) {
      html += `<article class="recap-art"><h3>${esc(b.recap.title)}</h3>${b.recap.paras.map((p) => (p.startsWith('## ') ? `<h4>${esc(p.slice(3))}</h4>` : `<p>${esc(p)}</p>`)).join('')}
        <p class="note">${esc(b.recap.source || 'ESPN')} recap, via ESPN.</p></article>`;
    }
    return html || '<p class="note bx-msg">Highlights show up here during the game, and the recap after it.</p>';
  }

  // Live cards tell their story from each game's play-by-play, fetched in the background about once a
  // minute while the Tonight tab is open (a finished game's just once).
  let storyBusy = false;
  async function refreshStories() {
    if (storyBusy || !D || document.hidden || state.tab !== 'tonight') return;
    storyBusy = true;
    let changed = false;
    try {
      for (const g of slate) {
        if (g.state === 'pre' || document.hidden || state.tab !== 'tonight') continue;
        const have = summaries.get(g.id);
        if (have && (have.data.state === 'final' || Date.now() - have.at < STORY_EVERY)) continue;
        try {
          const r = await fetch(SUMMARY + encodeURIComponent(g.id), { cache: 'no-cache' });
          if (!r.ok) continue;
          summaries.set(g.id, { data: parseSummary(await r.json()), at: Date.now() });
          changed = true;
        } catch (e) { /* the next poll tries again */ }
      }
    } finally {
      storyBusy = false;
    }
    if (changed) renderTonight();
  }

  /* ---------- season replay ---------- */
  let replay = null;
  function openReplay() {
    openSheet(`<div class="sh-head"><h2 class="sh-title" id="sheetTitle">Replay the season</h2>${closeBtn}</div>
      <div class="race-date" id="raceDate">Draft day</div>
      <div class="bars" id="bars">${PEOPLE.map((p, s) => `<div class="bar" data-s="${s}" style="${pc(s)};transform:translateY(${s * 40}px)"><span class="bn">${esc(p.name)}</span><span class="bt"><i></i><span class="bv">0</span></span></div>`).join('')}</div>
      <div class="race-ctl"><button type="button" class="btn" id="racePlay">Pause</button><button type="button" class="btn ghost" id="raceRestart">Restart</button></div>`, startReplay);
  }
  function startReplay() {
    stopReplay();
    const P = D.series.points, N = P.length;
    const max = Math.max(1, ...P[N - 1]) * 1.02;
    const speed = Math.max(4, N / 10);  // the whole replay takes about ten seconds
    const bars = [...document.querySelectorAll('#bars .bar')];
    replay = { t: 0, playing: true, last: performance.now(), raf: 0 };
    const frame = (now) => {
      if (!replay) return;
      const dt = Math.min(0.1, (now - replay.last) / 1000);
      replay.last = now;
      if (replay.playing) replay.t = Math.min(N - 1, replay.t + dt * (reduceMotion ? 1e6 : speed));
      const i = Math.floor(replay.t), j = Math.min(N - 1, i + 1), f = replay.t - i;
      const order = PEOPLE.map((_, s) => s).sort((a, b) => P[i][b] - P[i][a] || a - b);
      for (const el of bars) {
        const s = Number(el.dataset.s);
        const v = P[i][s] + (P[j][s] - P[i][s]) * f;
        el.style.transform = `translateY(${order.indexOf(s) * 40}px)`;
        el.querySelector('i').style.setProperty('--f', (v / max).toFixed(4));
        el.querySelector('.bv').textContent = Math.round(v);
      }
      $('raceDate').textContent = dayLabel(i);
      if (replay.t >= N - 1) { replay.playing = false; $('racePlay').textContent = 'Play'; }
      replay.raf = requestAnimationFrame(frame);
    };
    replay.raf = requestAnimationFrame(frame);
  }
  function stopReplay() {
    if (replay) cancelAnimationFrame(replay.raf);
    replay = null;
  }

  /* ---------- live scores from ESPN ---------- */
  function toast(text) {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.remove('show'), 4000);
  }

  const periodName = (p) => (p <= 4 ? 'Q' + p : p === 5 ? 'OT' : (p - 4) + 'OT');
  function clockText(status) {
    const t = (status && status.type) || {};
    if (t.name === 'STATUS_HALFTIME') return 'Half';
    if (t.name === 'STATUS_END_PERIOD') return 'End ' + periodName(status.period);
    if (t.completed) return 'Final';
    if (t.state === 'in') return `${periodName(status.period)} ${status.displayClock || ''}`.trim();
    return '';
  }

  // Points per period, from ESPN's linescores (the scoreboard has value, the game summary displayValue).
  const periodPoints = (k) => (k.linescores || []).map((l) => Number(l.value != null ? l.value : l.displayValue));
  // ESPN's top performer for a team in this game ("35 PTS, 7 REB, 10 AST").
  function topPerformer(k) {
    const r = (k.leaders || []).find((L) => L.name === 'rating');
    const a = r && r.leaders && r.leaders[0];
    return a && a.athlete && a.displayValue ? { name: a.athlete.shortName || a.athlete.displayName, line: a.displayValue } : null;
  }
  // A team's shooting and rebounding in this game, from the scoreboard.
  function boardStats(k) {
    const v = {};
    for (const x of k.statistics || []) v[x.name] = Number(x.displayValue);
    if (!Number.isFinite(v.fieldGoalsAttempted)) return null;
    return { fgm: v.fieldGoalsMade, fga: v.fieldGoalsAttempted, tpm: v.threePointFieldGoalsMade, tpa: v.threePointFieldGoalsAttempted, fta: v.freeThrowsAttempted, reb: v.rebounds };
  }
  const pauseOf = (status) => {
    const n = (status && status.type && status.type.name) || '';
    return n === 'STATUS_HALFTIME' ? 'half' : n === 'STATUS_END_PERIOD' ? 'end' : null;
  };

  function parseBoard(j, forDay) {
    const day = forDay || (j.day && j.day.date) || D.meta.today;
    const games = [];
    for (const e of j.events || []) {
      const c = e.competitions && e.competitions[0];
      if (!c || (e.season && e.season.type && e.season.type !== 2)) continue;
      const notes = ((c.notes || []).map((n) => n.headline || '').join(' ') + ' ' + ((c.type && c.type.text) || '')).toLowerCase();
      if (notes.includes('cup') && (notes.includes('championship') || /(^|[^a-z-])finals?\b/.test(notes))) continue;
      const sides = {};
      for (const k of c.competitors || []) {
        const t = BY_ESPN[k.team && k.team.abbreviation];
        if (t) sides[k.homeAway] = { t, score: Number(k.score), lines: periodPoints(k), star: topPerformer(k), stats: boardStats(k) };
      }
      if (!sides.home || !sides.away) continue;
      const st = (c.status && c.status.type) || {};
      const state = /POSTPONED|CANCELED|SUSPENDED|FORFEIT/.test(st.name || '') ? 'off' : st.completed ? 'final' : st.state === 'in' ? 'live' : 'pre';
      if (state === 'off') continue;
      const odds = c.odds && c.odds[0];
      const known = D.slate.find((g) => g.id === String(e.id));
      const scores = [sides.away.score, sides.home.score];
      const started = state !== 'pre';  // before tip-off ESPN's leaders and stats are season averages
      // Who has the ball, from the last play (the scoreboard doesn't say outright).
      const lp = state === 'live' && c.situation && c.situation.lastPlay;
      const sideById = {};
      for (const k of c.competitors || []) sideById[String((k.team && k.team.id) || k.id)] = k.homeAway === 'home' ? 1 : 0;
      const ball = lp ? ballAfter(null, { type: lp.type, text: lp.text, scoringPlay: Number(lp.scoreValue) > 0, shootingPlay: /\b(makes|misses|blocks)\b/i.test(lp.text || '') },
        lp.team ? sideById[String(lp.team.id)] : null) : null;
      games.push({
        id: String(e.id), day, away: sides.away.t, home: sides.home.t, tip: e.date, state,
        score: started && scores.every(Number.isFinite) ? scores : null,
        clock: clockText(c.status), gameClock: (c.status && c.status.displayClock) || '', ball,
        period: Number(c.status && c.status.period) || 0, pause: pauseOf(c.status),
        spread: odds && odds.spread != null && Number.isFinite(Number(odds.spread)) ? Number(odds.spread) : known && known.spread != null ? known.spread : null,
        leverage: known && known.leverage != null ? known.leverage : null,
        lines: started && sides.away.lines.length ? [sides.away.lines, sides.home.lines] : null,
        stars: started ? [sides.away.star, sides.home.star] : null,
        stats: started && sides.away.stats && sides.home.stats ? [sides.away.stats, sides.home.stats] : null,
      });
    }
    return { day, games };
  }

  /* data.json only moves when the GitHub job runs. If it's behind, fetch ESPN's results for the
     days in between (a week at most) so the standings never wait on it. */
  const isoPlus = (d, n) => new Date(Date.parse(d + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10);
  async function fillGaps(curDay) {
    let added = false;
    const recorded = new Set(D.games.map((g) => g[4]));
    const weekAgo = isoPlus(curDay, -7);
    for (let d = D.meta.today > weekAgo ? D.meta.today : weekAgo; d < curDay; d = isoPlus(d, 1)) {
      if (filled.has(d)) continue;
      try {
        const r = await fetch(`${ESPN}?dates=${d.replace(/-/g, '')}`, { cache: 'no-cache' });
        if (!r.ok) continue;
        const { games } = parseBoard(await r.json(), d);
        for (const g of games) {
          if (g.state !== 'final' || !g.score || extra.has(g.id) || recorded.has(g.id)) continue;
          extra.set(g.id, { day: d, away: g.away, home: g.home, winner: g.score[1] > g.score[0] ? g.home : g.away, id: g.id });
          added = true;
        }
        if (games.every((g) => g.state === 'final')) filled.add(d);
      } catch (e) { /* the next poll tries again */ }
    }
    return added;
  }

  let slateSig = '';
  function applyBoard(games, force) {
    const sig = JSON.stringify(games.map((g) => [g.id, g.state, g.score, g.clock]));
    if (sig === slateSig && !force) return;  // nothing new since the last poll
    slateSig = sig;
    const was = new Map(slate.map((g) => [g.id, g.state]));
    const before = new Map(ROWS.map((r) => [r.s, r.rank]));
    const finalsBefore = FINALS.length;
    slate = games;
    recompute();
    renderTonight();
    if (FINALS.length === finalsBefore) {
      renderStandings();  // scores and clocks moved; the standings didn't
      return;
    }
    renderDraft();
    const finals = slate.filter((g) => g.state === 'final' && g.score && was.has(g.id) && was.get(g.id) !== 'final');
    if (finals.length) {
      withRowMotion(renderStandings);
      const gained = new Array(NP).fill(0);
      const notes = finals.map((g) => {
        const homeWon = g.score[1] > g.score[0];
        const [win, lose] = homeWon ? [g.home, g.away] : [g.away, g.home];
        const pts = outcome(win, lose);
        pts.forEach((v, s) => { gained[s] += v; });
        const who = pts.flatMap((v, s) => (v ? [`${PEOPLE[s].name} +${v}`] : []));
        return `${win} beats ${lose} ${Math.max(...g.score)}-${Math.min(...g.score)}${who.length ? ' · ' + who.join(', ') : ''}`;
      });
      gained.forEach((v, s) => {
        if (!v || reduceMotion) return;
        const el = document.querySelector(`[data-pts="${s}"]`);
        if (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
      });
      const moves = ROWS.filter((r) => r.rank < before.get(r.s)).map((r) => `${r.name} up to ${ordinal(r.rank)}`);
      toast(notes.join(' · ') + (moves.length ? ' · ' + moves.join(', ') : ''));
    } else {
      renderStandings();
    }
  }

  async function poll() {
    clearTimeout(pollTimer);
    if (document.hidden) return;
    try {
      const r = await fetch(ESPN, { cache: 'no-cache' });
      if (!r.ok) throw new Error('ESPN ' + r.status);
      const board = parseBoard(await r.json());
      applyBoard(board.games, await fillGaps(board.day));
      liveOk = true;
      lastPoll = Date.now();
    } catch (e) {
      liveOk = false;
      renderTonight();
    }
    renderHeader();
    refreshStories();
    const busy = slate.some((g) => g.state === 'live' || (g.state === 'pre' && new Date(g.tip) - Date.now() < 15 * 60e3));
    pollTimer = setTimeout(poll, busy ? POLL_LIVE : POLL_IDLE);
  }

  async function loadData() {
    const r = await fetch('data.json?v=' + Date.now(), { cache: 'no-cache' });
    if (!r.ok) throw new Error('data.json ' + r.status);
    return r.json();
  }

  async function refreshData() {
    if (document.hidden) return;
    try {
      const data = await loadData();
      if (data.meta.hash === D.meta.hash) return;
      setData(data);
      recompute();
      renderAll();
      renderRace();
    } catch (e) { /* keep showing what we have */ }
  }

  /* iOS 26's short screen for home-screen apps (WebKit bug 301108; see the html rule in the CSS). If the
     page still comes up a status bar's height short, that rule didn't take (it needs display-mode to
     match, and 100lvh to be the whole screen), so the page is given the screen's height directly. That
     stays from then on: shrinking the page again would bring the band back. While the band is there
     anyway, it covers the home indicator, so the tab bar drops the room it keeps for it. A status bar
     that isn't see-through leaves the same short height, but its band is at the top: no top inset. */
  let fillScreen = false;
  function fitScreen() {
    const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden';
    document.body.appendChild(probe);
    const topInset = probe.offsetHeight;
    probe.remove();
    const full = matchMedia('(orientation: landscape)').matches ? screen.width : screen.height;
    const short = standalone && topInset > 0 && Math.abs(full - innerHeight - topInset) <= 2;
    if (short) fillScreen = true;
    document.documentElement.style.minHeight = fillScreen && topInset > 0 ? `${full}px` : '';
    document.documentElement.classList.toggle('band-below', short);
  }
  fitScreen();
  for (const type of ['load', 'pageshow', 'resize']) addEventListener(type, fitScreen);
  addEventListener('orientationchange', () => setTimeout(fitScreen, 300));
  setTimeout(fitScreen, 800);  // the safe-area insets can arrive after the first layout

  /* ---------- wiring ---------- */
  // Like an iPhone tab bar: each tab keeps its place, and tapping the tab you're on goes back to the top.
  // where: 'keep' (the tab's last place), 'top', or 'stay' (at startup). Tabs can also be swiped
  // sideways: the strip of tabs pages under the finger, and the tab bar follows once it's past halfway.
  const TABS = ['standings', 'tonight', 'race', 'draft'];
  const pager = $('pager');
  function setTab(tab, where = 'keep') {
    const page = $('page-' + tab);
    if (tab === state.tab && where === 'keep') {
      page.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
      return;
    }
    showTab(tab);
    pager.scrollLeft = TABS.indexOf(tab) * pager.clientWidth;
    if (where === 'top') page.scrollTop = 0;
  }
  function showTab(tab) {
    state.tab = tab;
    document.querySelectorAll('.tabbar [data-tab]').forEach((b) => {
      if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    pager.classList.toggle('locked', !!reorder && tab === 'tonight');
    if (tab === 'tonight') refreshStories();
  }
  pager.addEventListener('scroll', () => {
    const tab = TABS[Math.round(pager.scrollLeft / pager.clientWidth)];
    if (tab && tab !== state.tab) showTab(tab);
  }, { passive: true });

  function setMe(s) {
    state.me = s;
    store.set('wl-me', String(s));
    renderAll();
  }

  function renderAll() {
    renderHeader();
    renderStandings();
    renderTonight();
    renderDraft();
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-close], .backdrop, .game[data-box]');  // a whole game card opens its box score
    if (!t || Date.now() - droppedAt < 400) return;  // the touch that ended a drag isn't a tap
    if (t.id === 'backdrop' || t.hasAttribute('data-close')) return closeSheet();
    if (t.id === 'retryBtn') return boot();
    if (!D) return;
    if (t.dataset.reorder) return reorderAct(t.dataset.reorder);
    if (t.dataset.move && reorder) return moveSel(t.dataset.move);
    if (t.dataset.row && reorder) {  // pick a game to move, or let go of it
      reorder.sel = reorder.sel === t.dataset.row ? null : t.dataset.row;
      return renderTonight();
    }
    if (t.dataset.tab) return setTab(t.dataset.tab);
    if (t.dataset.goto) return setTab(t.dataset.goto, 'top');
    if (t.dataset.me != null) {
      const s = Number(t.dataset.me);
      if (!$('sheet').hidden) closeSheet();
      return setMe(s);
    }
    if (t.dataset.person != null) {
      const s = Number(t.dataset.person);
      state.expanded = state.expanded === s ? null : s;
      return renderStandings();
    }
    if (t.dataset.box) return openBox(t.dataset.box, t.dataset.from);
    if (t.dataset.boxSide && box) { box.side = t.dataset.boxSide; return renderBox(); }
    if (t.dataset.clip != null && box) {
      box.clip = Number(t.dataset.clip);
      renderBox();
      const v = $('hlVideo');
      if (v) { v.scrollIntoView({ block: 'nearest' }); v.play().catch(() => {}); }
      return;
    }
    if (t.hasAttribute('data-box-retry') && box) { box.failed = false; renderBox(); return loadBox(); }
    if (t.dataset.team) return openPick(t.dataset.team, t.dataset.side);
    if (t.dataset.metric) { state.metric = t.dataset.metric; state.scrub = null; return renderRace(); }
    if (t.dataset.focus != null) {
      const s = Number(t.dataset.focus);
      state.focus = state.focus === s ? null : s;
      return renderRace();
    }
    if (t.dataset.day != null) {
      if (!chart) return;
      setScrub(Number(t.dataset.day));
      return $('chart').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
    }
    if (t.dataset.bot != null) {
      const s = Number(t.dataset.bot);
      state.botOpen = state.botOpen === s ? null : s;
      return renderDraft();
    }
    if (t.id === 'headline') { state.head++; return renderStandings(); }
    if (t.id === 'meBtn') return openWho();
    if (t.id === 'replayBtn') return openReplay();
    if (t.id === 'racePlay' && replay) {
      if (!replay.playing && replay.t >= D.series.points.length - 1) replay.t = 0;
      replay.playing = !replay.playing;
      t.textContent = replay.playing ? 'Pause' : 'Play';
      return;
    }
    if (t.id === 'raceRestart' && replay) { replay.t = 0; replay.playing = true; $('racePlay').textContent = 'Pause'; }
  });

  const viewRace = $('view-race');
  viewRace.addEventListener('pointerdown', (e) => {
    const host = e.target.closest('#chart');
    if (!host) return;
    host.setPointerCapture(e.pointerId);
    scrubFromEvent(e);
  });
  viewRace.addEventListener('pointermove', (e) => {
    if (!e.target.closest('#chart')) return;
    if (e.pointerType === 'mouse' || e.buttons) scrubFromEvent(e);
  });
  viewRace.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'mouse' && e.target.closest && e.target.closest('#chart')) setScrub(null);
  }, true);
  viewRace.addEventListener('keydown', (e) => {
    if (e.target.id !== 'chart' || !chart) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      const cur = state.scrub == null ? chart.N - 1 : state.scrub;
      setScrub(cur + (e.key === 'ArrowRight' ? 1 : -1));
    } else if (e.key === 'Escape') setScrub(null);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
  document.addEventListener('toggle', (e) => {
    const key = e.target.dataset && e.target.dataset.keep;
    if (key) { if (e.target.open) opened.add(key); else opened.delete(key); }
  }, true);

  /* Swipe a sheet down to close it. A downward swipe from the top strip (the grip) always drags
     the sheet; from anywhere else only when the sheet is scrolled to the top, so it can still
     scroll. Sideways swipes are left to the box score table. */
  const sheetEl = $('sheet');
  let sheetDrag = null;
  sheetEl.addEventListener('touchstart', (e) => {
    sheetDrag = null;
    if (e.touches.length !== 1 || !sheetEl.classList.contains('open')) return;
    const t = e.touches[0];
    const grip = t.clientY - sheetEl.getBoundingClientRect().top < 44;
    sheetDrag = { x0: t.clientX, y0: t.clientY, t0: e.timeStamp, dy: 0, mode: null, grip };
  }, { passive: true });
  sheetEl.addEventListener('touchmove', (e) => {
    const d = sheetDrag;
    if (!d || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - d.x0, dy = t.clientY - d.y0;
    if (!d.mode) {
      if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      const pull = dy > 0 && dy > Math.abs(dx) && (d.grip || sheetEl.scrollTop <= 0) && e.cancelable;
      d.mode = pull ? 'sheet' : 'native';
      if (pull) { sheetEl.classList.add('dragging'); $('backdrop').classList.add('dragging'); }
    }
    if (d.mode !== 'sheet') return;
    e.preventDefault();  // the sheet follows the finger instead of the content scrolling
    d.dy = Math.max(0, dy);
    d.h = sheetEl.offsetHeight;
    sheetEl.style.transform = `translateY(${d.dy}px)`;
    $('backdrop').style.opacity = String(Math.max(0, 1 - d.dy / d.h));
  }, { passive: false });
  const endSheetDrag = (e) => {
    const d = sheetDrag;
    sheetDrag = null;
    if (!d || d.mode !== 'sheet') return;
    // Close on a long enough pull or a quick flick; otherwise spring back.
    const flick = d.dy > 30 && d.dy / Math.max(1, e.timeStamp - d.t0) > 0.6;
    const close = d.dy > Math.min(140, d.h / 4) || flick;
    sheetEl.classList.remove('dragging');
    $('backdrop').classList.remove('dragging');
    sheetEl.style.transform = '';
    $('backdrop').style.opacity = '';
    if (close) closeSheet();
  };
  sheetEl.addEventListener('touchend', endSheetDrag);
  sheetEl.addEventListener('touchcancel', endSheetDrag);
  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    pager.scrollLeft = TABS.indexOf(state.tab) * pager.clientWidth;  // a new width: stay on the same tab
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (D) drawChart(); }, 150);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && D) {
      poll();
      refreshData();
      if (box && (!box.data || box.data.state === 'live')) loadBox();
    }
  });

  async function boot() {
    try {
      setData(await loadData());
    } catch (e) {
      $('dateline').textContent = 'Offline';
      $('view-standings').innerHTML = `<div class="sect card"><h2>Couldn't load the standings</h2>
        <p>Check your connection and try again.</p><button type="button" class="btn" id="retryBtn">Try again</button></div>`;
      return;
    }
    const me = store.get('wl-me');
    state.me = me == null ? null : Number(me);
    recompute();
    renderAll();
    renderRace();
    setTab(state.tab, 'stay');
    poll();
    setInterval(refreshData, DATA_EVERY);
    setInterval(() => { if (D) renderHeader(); }, 60e3);
  }
  boot();
})();
</script>
</body>
</html>
