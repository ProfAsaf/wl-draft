<!doctype html>
<html lang="en">
<head>

<style>
/* Layout: phone-first app shell. A sticky scoreboard header, one scrolling column per tab,
   a fixed tab bar at the bottom, and details in bottom sheets. Dark first; light follows the phone. */
:root {
  color-scheme: dark;
  --bg: #0c0e12;          /* arena at night */
  --surface: #15181e;     /* cards and chart surface */
  --surface-2: #1e222a;   /* raised: chips, pressed rows, board cells */
  --line: #262b34;        /* hairlines and gridlines */
  --line-strong: #3a414d; /* baselines, swatch rings */
  --ink: #f2f4f7;
  --ink-2: #b8bfca;
  --muted: #8a919d;
  --live: #ff5a4f;
  --you: rgba(255, 255, 255, 0.055);
  --pos: #3987e5;         /* ahead of Vegas */
  --neg: #e66767;         /* behind Vegas */
  --p1: #3987e5; --p2: #d95926; --p3: #199e70; --p4: #c98500; --p5: #d55181;
  --font-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-md: 14px;
  --tabbar-h: 52px;
  --tabbar-pad: max(calc(env(safe-area-inset-bottom, 0px) - 10px), 0px);  /* the labels can sit a little into the home bar's margin */
}
:root.band-below { --tabbar-pad: 0px; }  /* iOS's own band under the app already covers the home indicator (see fitScreen) */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef0f3; --surface: #fbfbfc; --surface-2: #eceff3; --line: #e1e4e9; --line-strong: #c3c9d1;
    --ink: #111418; --ink-2: #434a55; --muted: #616975; --live: #d93a30; --you: rgba(17, 20, 24, 0.045);
    --pos: #2a78d6; --neg: #e34948;
    --p1: #2a78d6; --p2: #eb6834; --p3: #1baf7a; --p4: #eda100; --p5: #e87ba4;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef0f3; --surface: #fbfbfc; --surface-2: #eceff3; --line: #e1e4e9; --line-strong: #c3c9d1;
  --ink: #111418; --ink-2: #434a55; --muted: #616975; --live: #d93a30; --you: rgba(17, 20, 24, 0.045);
  --pos: #2a78d6; --neg: #e34948;
  --p1: #2a78d6; --p2: #eb6834; --p3: #1baf7a; --p4: #eda100; --p5: #e87ba4;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
/* The page itself never scrolls. Header, the tabs' strip and the tab bar are rows of a full-height column,
   so the bars aren't position: fixed; on iPhones fixed bars get dragged around when the page rubber-bands. */
html { -webkit-text-size-adjust: 100%; background: var(--bg); height: 100%; overscroll-behavior: none; }
/* iOS 26 gives a home-screen app with the see-through status bar a screen that's short by the status bar's
   height, and fills the rest with a gray band the page can't draw on, but only while the page is shorter
   than the screen (WebKit bug 301108). So the page is made as tall as the whole screen. The 100lvh cap
   keeps it from growing past the screen, and scrolling, once iOS hands the whole screen over. Anywhere
   else this works out to 100%. If it doesn't take, fitScreen tries again from the script. */
@media (display-mode: standalone) {
  html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px))); }
}
/* Pinned to the screen's edges, so it fills whatever screen iOS gives the page. The body never scrolls,
   so the header and tab bar don't drift when the page rubber-bands. */
body {
  margin: 0; position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }

/* The four tabs sit side by side in a strip that pages sideways, so a swipe left or right follows the
   finger to the next tab and snaps there. Each tab scrolls up and down on its own and keeps its place. */
.pager {
  flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none;
}
.pager::-webkit-scrollbar { display: none; }
.pager.locked { overflow-x: hidden; }  /* while reordering games, a sideways drag shouldn't change tabs */
.page {
  flex: 0 0 100%; min-width: 0; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch;
  scroll-snap-align: start; scroll-snap-stop: always;
}
.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 28px;
}

/* Header */
.top {
  flex: none; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.top-inner { max-width: 528px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 25px; letter-spacing: 0.02em; line-height: 1; }
.wordmark span { color: var(--muted); font-weight: 600; margin-left: 3px; }
.subline { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.live-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--surface);
  font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase;
}
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: pulse 1.6s ease-in-out infinite; flex: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.me-btn {
  width: 38px; height: 38px; border-radius: 50%; background: var(--surface); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 17px; box-shadow: inset 0 0 0 2px var(--pc, var(--line-strong));
}

/* Views */
.view { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border-radius: var(--r-md); }
.note { font-size: 12.5px; color: var(--muted); }
.empty { padding: 16px; font-size: 14px; color: var(--ink-2); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 12px; background: var(--ink); color: var(--bg);
  font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase;
}
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.linkbtn { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; font-weight: 600; font-size: 14px; color: var(--ink); }

/* Who's checking */
.who { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.who h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.who-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.who-top .linkbtn { min-height: 32px; color: var(--ink-2); font-size: 13.5px; }
.who-btns { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.who-btns button {
  min-height: 52px; border-radius: 10px; background: var(--surface-2); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 5px; font-size: 13px; font-weight: 650;
}
.who-btns button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }

/* Headline */
.headline { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); width: 100%; }
.headline .q { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.15; text-wrap: balance; }
.headline .dots { display: flex; gap: 5px; }
.headline .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
.headline .dots i.on { background: var(--ink-2); }

/* Standings board */
.board { overflow: hidden; }
.board .row, .board .bhead {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) 46px 44px 52px; align-items: center; column-gap: 6px;
  padding: 11px 12px; width: 100%;
}
.board .bhead { padding-block: 10px 4px; }
.colhead { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.prow + .prow { border-top: 1px solid var(--line); }
.prow.me { background: var(--you); }
.num { text-align: right; font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.rk { display: flex; flex-direction: column; line-height: 1.1; font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nm { display: flex; align-items: center; gap: 9px; min-width: 0; }
.nm > span { min-width: 0; }
.nm b { font-weight: 650; font-size: 16px; }
.nm small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pc); flex: none; display: inline-block; }
.pts { font-size: 28px; font-weight: 700; line-height: 1; display: inline-block; transform-origin: right center; }
.last { font-size: 18px; font-weight: 600; color: var(--ink-2); }
.pct { font-size: 18px; font-weight: 700; line-height: 1.1; }
.pct small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.rk .mv { margin-top: 2px; font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.youtag {
  font-style: normal; margin-left: 6px; font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: var(--ink); color: var(--bg); vertical-align: 2px;
}
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.3); } 100% { transform: scale(1); } }
.bump { animation: bump 0.7s ease-out; }

/* Picks inside a person's row */
.picks { padding: 0 12px 12px 42px; }
.pick {
  display: grid; grid-template-columns: minmax(0, 1fr) 46px 44px 58px; column-gap: 6px; align-items: center;
  padding: 7px 0; width: 100%; border-top: 1px solid var(--line);
}
.pick.phead { border-top: 0; padding-block: 2px 4px; }
.pick .num { font-size: 16px; font-weight: 600; }
.pick .vs { color: var(--ink-2); }
.pick .ppts { font-size: 20px; font-weight: 700; line-height: 1.05; }  /* what the pick has added to your score */
.pick .ppts small { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.nx { text-align: right; font-size: 12px; line-height: 1.2; color: var(--ink-2); }
.nx b { display: block; font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--ink); }
.psum { padding-top: 8px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }

.tm { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.02em; white-space: nowrap; }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--tc); box-shadow: inset 0 0 0 1px var(--line-strong); flex: none; }
.side {
  font-family: var(--font-display); font-weight: 700; font-size: 12px; line-height: 1; padding: 2px 4px; margin-left: 4px;
  border-radius: 4px; border: 1px solid var(--line-strong); color: var(--ink-2);
}

/* Tonight */
.tonight-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.tonight-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; }
.tonight-head p { font-size: 13px; color: var(--muted); margin-top: 4px; }
.need { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.need b { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.need span { font-size: 13px; color: var(--muted); }
.game { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.game.mine { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.game[data-box] { cursor: pointer; }
.btn.slim { min-height: 36px; padding: 0 12px; gap: 6px; border-radius: 10px; font-size: 15px; white-space: nowrap; }
svg.ico { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
/* Reordering tonight's games: a bar pinned to the top (Cancel, Save, the arrows) over one thin row per game.
   Tap a row to pick it and move it with the arrows, or drag it by the handle on its right. */
.rbar {
  position: sticky; top: 0; z-index: 4; margin: -14px -16px 0; padding: 12px 16px 10px;
  display: flex; flex-direction: column; gap: 10px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.rbar-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.rbar-top .linkbtn { justify-self: start; color: var(--ink-2); }
.rbar-top b { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1; }
.rbar-top .btn { justify-self: end; }
.rmoves { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.rmoves button {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 40px; border-radius: 10px;
  background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line);
  font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase;
}
.rmoves button:disabled { opacity: 0.35; cursor: default; }
.rhint { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -4px; }
.rhint .linkbtn { min-height: 32px; font-size: 13.5px; color: var(--ink-2); }
.rhint .note svg { width: 13px; height: 10px; margin-left: 2px; vertical-align: -1px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.rlist { display: flex; flex-direction: column; gap: 6px; }
.rrow {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; padding-left: 12px; border-radius: 12px;
  background: var(--surface); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.rrow.mine { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.rrow.sel { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--ink); }
.rteams { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; }
.rteams .at { color: var(--muted); font-size: 13px; }
.rteams .yours {
  margin-left: -2px; padding: 1px 5px; border-radius: 4px; background: var(--ink); color: var(--bg);
  font-family: var(--font-display); font-weight: 700; font-size: 12px; line-height: 1.25;
}
.rst { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-display); font-weight: 700; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rst small { font-size: 13px; font-weight: 600; color: var(--muted); }
.rgrip { flex: none; align-self: stretch; display: grid; place-items: center; width: 46px; color: var(--muted); touch-action: none; cursor: grab; }
.rgrip svg { width: 18px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.rlist.sorting .rrow { transition: transform 0.18s ease; }
.rlist.sorting .rrow.lifted { transition: none; position: relative; z-index: 3; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), inset 0 0 0 2px var(--ink); cursor: grabbing; }
.gtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 22px; }
.gstatus { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; white-space: nowrap; }
.gstatus .spr { color: var(--muted); font-weight: 600; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.tag.big { background: var(--ink); color: var(--bg); }
.teams { display: flex; flex-direction: column; gap: 4px; }
.tl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tl .tn { flex: 1 1 auto; min-width: 0; color: var(--ink-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl .sc { flex: none; min-width: 42px; text-align: right; font-family: var(--font-display); font-size: 25px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.tl.lead .sc { color: var(--ink); font-weight: 700; }
.qs { flex: none; display: flex; }
.qs i { width: 23px; text-align: right; font-style: normal; font-family: var(--font-display); font-size: 15px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl.qh { margin-bottom: -4px; }
.tl.qh .qs i, .tl.qh .sc { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; line-height: 1; color: var(--muted); }
.gfoot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 40px; padding-top: 10px; border-top: 1px solid var(--line); }
.stars { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 13px; color: var(--ink-2); }
.stars b { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.02em; color: var(--ink); margin-right: 6px; }
.stars em { font-style: normal; color: var(--muted); }
.gfoot .more { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.story { font-size: 13.5px; line-height: 1.45; color: var(--ink-2); text-wrap: pretty; }
.ball { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #e8742a; margin-left: 6px; vertical-align: 1px; flex: none; }
.wp { display: flex; align-items: center; gap: 10px; }
.wpbar { flex: 1; display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; }
.wpbar i { display: block; min-width: 2px; }
.wpl { font-family: var(--font-display); font-weight: 700; font-size: 13.5px; letter-spacing: 0.02em; white-space: nowrap; }
.oc { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px; align-items: center; }
.oc > span { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--surface-2); font-size: 13.5px; font-weight: 600; }
.pchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.pchip b { font-family: var(--font-display); font-size: 15px; }
.pchip.you { box-shadow: inset 0 0 0 1.5px var(--ink); }
.pchip.got { background: var(--ink); color: var(--bg); }
.pchip .via {
  font-style: normal; font-family: var(--font-display); font-size: 12.5px; font-weight: 700; letter-spacing: 0.03em;
  padding: 0 4px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--ink-2);
}
.pchip.got .via { border-color: currentColor; color: inherit; }
.nobody { font-size: 13px; color: var(--muted); }
.preview { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.prev-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; }
.prev-row .when { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.prev-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.prev-head b { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.ahead-list { display: flex; flex-direction: column; }
.ahead-list div { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }

/* Box score sheet */

      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Draft
    </button>
  </div>
</nav>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden>
  <div class="grip"></div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard';
  const POLL_LIVE = 30e3;       // while games are on
  const POLL_IDLE = 5 * 60e3;   // otherwise
  const DATA_EVERY = 5 * 60e3;  // re-read data.json for new odds, history and schedule

  /* ---------- helpers ---------- */
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const signed = (x, d = 1) => {
    const r = Number(x.toFixed(d));
    return (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r).toFixed(d);
  };
  const pct = (p) => {
    const v = p * 100;
    return v < 0.5 ? '<1%' : v > 99.5 ? '>99%' : Math.round(v) + '%';
  };
  const ordinal = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
  const store = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage unavailable; keep going */ } },
  };
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const HEX = /^#[0-9a-f]{6}$/i;
  const andList = (xs) => (xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1]);

  const fmtDay = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
  const fmtMonth = new Intl.DateTimeFormat(undefined, { month: 'short', timeZone: 'UTC' });
  const fmtTime = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
  const fmtWeekday = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
  const fmtHeader = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const isoDay = (iso) => fmtDay.format(new Date(iso + 'T12:00:00Z'));
  const dateKey = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  const whenLabel = (tip) => {
    const d = new Date(tip);
    return dateKey(d) === dateKey(new Date()) ? fmtTime.format(d) : fmtWeekday.format(d);
  };

  /* ---------- state ---------- */
  let D = null;           // data.json, written by the GitHub Action
  let PEOPLE = [], NP = 0, TEAMS = {}, OWN = { W: {}, L: {} }, BY_ESPN = {}, paper = [];
  let slate = [];         // today's games; live from ESPN when we can reach it
  let liveOk = null;      // did the last ESPN poll work?
  let lastPoll = 0;
  let FINALS = [], REC = {}, ROWS = [], MOVE = [], DAYCOL = null;
  let pollTimer = 0;
  const extra = new Map();   // finals from days data.json hasn't recorded yet, fetched from ESPN
  const filled = new Set();  // those days, once every game on them is final
  const state = { tab: 'standings', me: null, expanded: null, head: 0, metric: 'pct', focus: null, scrub: null, botOpen: null };
  const opened = new Set();  // fold-away sections left open, so a re-render doesn't close them
  const pc = (s) => `--pc:var(--p${s + 1})`;

  function setData(data) {
    D = data;
    PEOPLE = D.people;
    NP = PEOPLE.length;
    TEAMS = D.teams;
    OWN = { W: {}, L: {} };
    PEOPLE.forEach((p, s) => p.picks.forEach((k) => { OWN[k.side][k.team] = s; }));
    BY_ESPN = {};
    for (const [t, v] of Object.entries(TEAMS)) BY_ESPN[v.espn || t] = t;
    paper = PEOPLE.map((p) => p.picks.reduce((a, k) => a + lineValue(k.team, k.side), 0));
    if (liveOk !== true) slate = D.slate.map((g) => ({ ...g, day: D.meta.today, score: g.score || null, clock: g.state === 'final' ? 'Final' : '' }));
    else for (const g of slate) { const m = D.slate.find((x) => x.id === g.id); if (m && m.leverage != null) g.leverage = m.leverage; }
  }
  // What Vegas expects from a pick: the preseason line scaled so the league adds up to a real season.
  const fairLine = (team) => TEAMS[team].fair || TEAMS[team].line;
  const lineValue = (team, side) => (side === 'W' ? fairLine(team) : 82 - fairLine(team));
  const currentDay = () => (slate.length ? slate[0].day : D.meta.today);

  /* ---------- results ---------- */
  function finalsList() {
    const out = D.games.map(([d, away, home, winner, id]) => ({ day: D.days[d], away, home, winner, id }));
    const known = new Set(out.map((g) => g.id));
    for (const g of extra.values()) {
      if (!known.has(g.id)) { out.push(g); known.add(g.id); }
    }
    for (const g of slate) {
      if (g.state === 'final' && g.score && !known.has(g.id)) {
        out.push({ day: g.day, away: g.away, home: g.home, winner: g.score[1] > g.score[0] ? g.home : g.away, id: g.id });
      }
    }
    return out;
  }

  function records(finals) {
    const rec = {};
    for (const t of Object.keys(TEAMS)) rec[t] = { w: 0, l: 0, log: [] };
    for (const g of finals) {
      rec[g.home].log.push({ id: g.id, day: g.day, opp: g.away, away: false, won: g.winner === g.home });
      rec[g.away].log.push({ id: g.id, day: g.day, opp: g.home, away: true, won: g.winner === g.away });
    }
    for (const r of Object.values(rec)) {
      r.w = r.log.filter((x) => x.won).length;
      r.l = r.log.length - r.w;
    }
    return rec;
  }

  function pickStats(rec, team, side) {
    const r = rec[team];
    const gp = r.w + r.l;
    const pts = side === 'W' ? r.w : r.l;
    return { team, side, gp, pts, w: r.w, l: r.l, vs: pts - lineValue(team, side) / 82 * gp, pace: gp ? pts / gp * 82 : 0 };
  }

  function table(rec) {
    const rows = PEOPLE.map((p, s) => {
      const picks = p.picks.map((k) => ({ ...k, ...pickStats(rec, k.team, k.side), owner: s }));
      const pts = picks.reduce((a, k) => a + k.pts, 0);
      const games = picks.reduce((a, k) => a + k.gp, 0);
      return { s, name: p.name, picks, pts, games, pct: games ? pts / games : 0, vs: picks.reduce((a, k) => a + k.vs, 0) };
    });
    // Ranked like NBA standings: by winning percentage (points per game your teams have played), then points.
    const ahead = (o, r) => o.pct > r.pct || (o.pct === r.pct && o.pts > r.pts);
    for (const r of rows) {
      r.rank = 1 + rows.filter((o) => ahead(o, r)).length;
      r.tied = rows.some((o) => o !== r && o.pct === r.pct && o.pts === r.pts);
    }
    return rows.sort((a, b) => a.rank - b.rank || b.vs - a.vs);
  }
  const fmtPct = (r) => (!r.games ? '–' : r.pts === r.games ? '1.000' : (r.pts / r.games).toFixed(3).slice(1));

  // The picks that score if `winner` beats `loser`, per person: a W pick on the winner, an L pick on the loser.
  function outcomePicks(winner, loser) {
    const picks = PEOPLE.map(() => []);
    if (OWN.W[winner] != null) picks[OWN.W[winner]].push(winner + ' W');
    if (OWN.L[loser] != null) picks[OWN.L[loser]].push(loser + ' L');
    return picks;
  }
  const outcome = (winner, loser) => outcomePicks(winner, loser).map((p) => p.length);

  function pointsOn(day) {
    const pts = new Array(NP).fill(0);
    for (const g of FINALS) {
      if (g.day !== day) continue;
      outcome(g.winner, g.winner === g.home ? g.away : g.home).forEach((v, s) => { pts[s] += v; });
    }
    return pts;
  }

  function recompute() {
    FINALS = finalsList();
    REC = records(FINALS);
    ROWS = table(REC);
    const latest = FINALS.reduce((m, g) => (g.day > m ? g.day : m), '');
    const before = table(records(FINALS.filter((g) => g.day < latest)));
    const hadPoints = before.some((r) => r.pts > 0);
    MOVE = PEOPLE.map((_, s) => (hadPoints ? before.find((r) => r.s === s).rank - rowOf(s).rank : 0));
    const cur = currentDay();
    if (slate.some((g) => g.state === 'live' || g.state === 'final')) DAYCOL = { label: 'Today', values: pointsOn(cur) };
    else {
      const prior = FINALS.reduce((m, g) => (g.day < cur && g.day > m ? g.day : m), '');
      DAYCOL = { label: 'Last', values: prior ? pointsOn(prior) : null };
    }
  }
  const rowOf = (s) => ROWS.find((r) => r.s === s);

  function stakes(g) {
    const away = outcome(g.away, g.home);
    const home = outcome(g.home, g.away);
    const A = away.flatMap((v, s) => (v ? [s] : []));
    const H = home.flatMap((v, s) => (v ? [s] : []));
    let tag = null;
    if ((g.home === 'POR' || g.away === 'POR') && OWN.W.POR != null && OWN.L.POR != null) tag = 'Civil war';
    else if (A.length && H.length && !A.some((s) => H.includes(s))) tag = OWN.W[g.home] == null && OWN.W[g.away] == null ? 'Tank bowl' : 'Head-to-head';
    else if (!A.length && !H.length) tag = 'No stakes';
    else if ((!A.length || !H.length) && new Set([...A, ...H]).size >= 2) tag = 'Win-win';
    else if ([...away, ...home].some((v) => v >= 2)) tag = 'Double up';
    return { away, home, tag };
  }

  function myNight(me) {
    const needs = [];
    let max = 0;
    for (const g of slate) {
      if (g.state === 'final' || me == null || me < 0) continue;
      const st = stakes(g);
      const a = st.away[me], h = st.home[me];
      if (!a && !h) continue;
      if (a && h) { needs.push({ g, team: null, pts: Math.min(a, h), picks: [] }); max += Math.max(a, h); continue; }
      const [win, lose] = a ? [g.away, g.home] : [g.home, g.away];
      needs.push({ g, team: win, pts: a || h, picks: outcomePicks(win, lose)[me] });
      max += a || h;
    }
    return { needs, max };
  }

  function bigGame() {
    const open = slate.filter((g) => g.state !== 'final' && g.leverage != null);
    return open.length ? open.reduce((a, b) => (b.leverage > a.leverage ? b : a)) : null;
  }

  function botTable() {
    return PEOPLE.map((p, s) => {
      const picks = D.bots[s].map(([team, side]) => pickStats(REC, team, side));
      const bot = picks.reduce((a, k) => a + k.pts, 0);
      const mine = rowOf(s).pts;
      return { s, name: p.name, mine, bot, diff: mine - bot, picks };
    });
  }

  function winStreak(log) {
    let n = 0;
    for (let i = log.length - 1; i >= 0 && log[i].won; i--) n++;
    return n;
  }

  function headlines() {
    if (!FINALS.length) return ['Opening night. Everybody is tied at zero.'];
    const out = [];
    const leaders = ROWS.filter((r) => r.rank === 1);
    const second = ROWS.find((r) => r.rank > 1);
    const latest = FINALS[FINALS.length - 1].day;
    if (leaders.length > 1) {
      out.push(`A tie at the top: ${andList(leaders.map((r) => r.name))} at ${fmtPct(leaders[0])}.`);
    } else if (second) {
      const first = leaders[0];
      const next = ROWS.filter((r) => r.rank === second.rank).map((r) => r.name);
      const turn = D.moments.find((m) => m[0] === D.series.points.length - 1 && m[1].startsWith(first.name) && /lead|top/.test(m[1]));
      const lead = turn ? `${first.name} is ${/back/.test(turn[1]) ? 'back on top' : 'in the lead'}` : `${first.name} leads`;
      out.push(`${lead} at ${fmtPct(first)}. ${andList(next)} ${next.length > 1 ? 'are' : 'is'} next at ${fmtPct(second)}.`);
    }
    const worst = botTable().reduce((a, b) => (b.diff < a.diff ? b : a));
    if (worst.diff < 0) out.push(`${worst.name}Bot is beating ${worst.name} by ${-worst.diff}. The robots are coming.`);
    for (const r of ROWS) {
      for (const k of r.picks) {
        const log = REC[k.team].log;
        if (k.side !== 'L' || !log.length || log[log.length - 1].day !== latest || !log[log.length - 1].won) continue;
        const n = winStreak(log);
        out.push(n >= 2 ? `The ${TEAMS[k.team].name} have won ${n} straight. ${r.name} is not okay.` : `The ${TEAMS[k.team].name} won. ${r.name} is not okay.`);
      }
    }
    let best = null;
    for (const r of ROWS) for (const k of r.picks) if (k.side === 'W' && k.gp && (!best || k.w / k.gp > best.k.w / best.k.gp || (k.w / k.gp === best.k.w / best.k.gp && k.w > best.k.w))) best = { r, k };
    if (best && best.k.w) out.push(`${best.r.name}'s ${TEAMS[best.k.team].name} are ${best.k.w}-${best.k.l}. Of course they are.`);
    if (OWN.W.POR != null && OWN.L.POR != null && REC.POR.log.length) {
      const w = REC.POR.w, l = REC.POR.l, nw = PEOPLE[OWN.W.POR].name, nl = PEOPLE[OWN.L.POR].name;
      out.push(w === l ? `Portland Civil War: ${nw} and ${nl} are dead even at ${w}.` : `Portland Civil War: ${w > l ? nw : nl} leads ${w > l ? nl : nw} ${Math.max(w, l)}-${Math.min(w, l)}.`);
    }
    return out;
  }

  /* ---------- small pieces of markup ---------- */
  const icon = (d) => `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="${d}"/></svg>`;
  const ICON = {
    order: icon('M5 13.5v-11M2 5.5l3-3 3 3M11 2.5v11M8 10.5l3 3 3-3'),
    top: icon('M3 2.5h10M8 14V6.5M4 10.5l4-4 4 4'),
    up: icon('M8 13.5v-11M3.5 7L8 2.5 12.5 7'),
    down: icon('M8 2.5v11M3.5 9L8 13.5 12.5 9'),
    bottom: icon('M3 13.5h10M8 2v7.5M4 5.5l4 4 4-4'),
  };
  const HANDLE = '<svg viewBox="0 0 18 14" aria-hidden="true"><path d="M1 2h16M1 7h16M1 12h16"/></svg>';  // the drag handle
  const teamColor = (t) => (HEX.test(TEAMS[t].color || '') ? TEAMS[t].color : '#777777');
  const teamChip = (t) => `<span class="tm"><i class="sw" style="--tc:${teamColor(t)}"></i>${esc(t)}</span>`;
  const sideTag = (side) => `<span class="side">${side}</span>`;
  const personChip = (s, picks, got) => `<span class="pchip${s === state.me ? ' you' : ''}${got ? ' got' : ''}" style="${pc(s)}"><i></i>${s === state.me ? 'You' : esc(PEOPLE[s].name)}${picks.map((p) => ` <em class="via">${esc(p)}</em>`).join('')} <b>+${picks.length}</b></span>`;
  const spreadText = (g) => {
    if (g.spread == null) return '';
    if (g.spread === 0) return 'Pick’em';
    return `${g.spread < 0 ? g.home : g.away} −${Math.abs(g.spread)}`;
  };

  // Games after today from data.json, minus any the live scoreboard already covers (data.json can lag a day).
  const upcoming = () => D.ahead.filter(([tip, away, home]) => Date.parse(tip) > Date.now() - 6 * 3600e3
    && !slate.some((g) => g.away === away && g.home === home));

  function nextGames(team, n) {
    const out = [];
    for (const g of slate) {
      if (g.state !== 'final' && (g.home === team || g.away === team)) out.push({ tip: g.tip, opp: g.home === team ? g.away : g.home, away: g.away === team, today: true, g });
    }
    for (const [tip, away, home] of upcoming()) {
      if (out.length >= n) break;
      if (away === team || home === team) out.push({ tip, opp: away === team ? home : away, away: away === team });
    }
    return out.slice(0, n);
  }

  function nextCell(team) {
    const [n] = nextGames(team, 1);
    if (!n) return '<span class="nx">–</span>';
    const when = n.g && n.g.state === 'live' ? 'Live' : whenLabel(n.tip);
    return `<span class="nx"><b>${n.away ? '@' : 'v'}${esc(n.opp)}</b>${esc(when)}</span>`;
  }

  /* ---------- header ---------- */
  function renderHeader() {
    const n = slate.filter((g) => g.state === 'live').length;
    const updated = Math.max(new Date(D.meta.updated).getTime() || 0, liveOk ? lastPoll : 0);
    let status = updated ? `Updated ${fmtTime.format(new Date(updated))}` : '';
    if (liveOk === false) status = 'Live scores unavailable';
    $('dateline').textContent = `${fmtHeader.format(new Date())}${status ? ' · ' + status : ''}`;
    $('livePill').hidden = n === 0;
    $('liveCount').textContent = `${n} live`;
    $('tabDot').hidden = n === 0;
    const me = $('meBtn');
    if (state.me != null && state.me >= 0) {
      me.textContent = PEOPLE[state.me].name[0];
      me.style.setProperty('--pc', `var(--p${state.me + 1})`);
      me.setAttribute('aria-label', `You are ${PEOPLE[state.me].name}. Change`);
    } else {
      me.textContent = '?';
      me.style.removeProperty('--pc');
      me.setAttribute('aria-label', 'Choose who you are');
    }
  }

  /* ---------- standings ---------- */
  function whoCard() {
    return `<div class="who card"><div class="who-top"><h2>Who's checking?</h2><button type="button" class="linkbtn" data-me="-1">Just browsing</button></div>
      <div class="who-btns">${PEOPLE.map((p, s) => `<button type="button" data-me="${s}" aria-pressed="${state.me === s}"><i class="dot" style="${pc(s)}"></i>${esc(p.name)}</button>`).join('')}</div></div>`;
  }

  function rowHtml(r) {
    const s = r.s, mv = MOVE[s], mine = state.me === s, open = state.expanded === s;
    const day = DAYCOL.values ? (DAYCOL.values[s] ? '+' + DAYCOL.values[s] : '0') : '–';
    return `<div class="prow${mine ? ' me' : ''}" data-key="p${s}">
      <button type="button" class="row" data-person="${s}" aria-expanded="${open}">
        <span class="rk">${r.tied ? 'T' : ''}${r.rank}${mv ? `<span class="mv" aria-label="${mv > 0 ? 'up ' + mv : 'down ' + -mv}">${mv > 0 ? '▲' + mv : '▼' + -mv}</span>` : ''}</span>
        <span class="nm"><i class="dot" style="${pc(s)}"></i><span><b>${esc(r.name)}</b>${mine ? '<em class="youtag">You</em>' : ''}<small>${signed(r.vs)} vs Vegas</small></span></span>
        <span class="num"><span class="pts" data-pts="${s}">${r.pts}</span></span>
        <span class="num last">${day}</span>
        <span class="num pct">${fmtPct(r)}<small>${r.pts}-${r.games - r.pts}</small></span>
      </button>
      ${open ? picksHtml(r) : ''}
    </div>`;
  }

  function picksHtml(r) {
    return `<div class="picks">
      <div class="pick phead"><span class="colhead">Pick</span><span class="colhead num">Pts</span><span class="colhead num">Vegas</span><span class="colhead nx">Next</span></div>
      ${r.picks.map((k) => `<button type="button" class="pick" data-team="${k.team}" data-side="${k.side}">
        <span>${teamChip(k.team)}${sideTag(k.side)}</span>
        <span class="num ppts">${k.pts}<small>of ${k.gp}</small></span>
        <span class="num vs">${signed(k.vs)}</span>
        ${nextCell(k.team)}
      </button>`).join('')}
      <p class="psum">Title odds ${pct(D.oddsNow[r.s])}. ${D.meta.oddsBasis === 'market' ? 'Vegas now projects' : 'Projected finish'} ${Math.round(D.projNow[r.s])}; draft-day projection was ${Math.round(paper[r.s])}.</p>
    </div>`;
  }

  function tonightPreview() {
    const liveN = slate.filter((g) => g.state === 'live').length;
    const left = slate.filter((g) => g.state !== 'final').length;
    if (!slate.length) {
      const next = upcoming()[0];
      return `<div class="preview card"><div class="prev-head"><b>Tonight</b><span class="note">No games today</span></div>
        ${next ? `<div class="prev-row"><span class="note">Next games ${esc(fmtWeekday.format(new Date(next[0])))}</span></div>` : ''}</div>`;
    }
    let body = '';
    if (state.me != null && state.me >= 0) {
      const { needs, max } = myNight(state.me);
      const done = myDay(state.me);
      const head = needs.length ? `Up to +${max} for you` : left ? 'Nothing riding on it for you'
        : `All final${done.length ? ` · +${done.filter((r) => r.got).length} for you` : ''}`;
      body = `<div class="prev-head"><b>Today</b><span class="note">${esc(head)}</span></div>`;
      body += needs.map(({ g, team, pts, picks }) => `<div class="prev-row"><span>${teamChip(g.away)} <span class="note">@</span> ${teamChip(g.home)} <span class="note">${team ? `need ${esc(team)} (${esc(picks.join(', '))})` : `+${pts} either way`}</span></span>
        <span class="when">${g.state === 'live' && g.score ? `${g.score[0]}–${g.score[1]}` : esc(fmtTime.format(new Date(g.tip)))}</span></div>`).join('');
    } else {
      const big = bigGame();
      body = `<div class="prev-head"><b>Today</b><span class="note">${slate.length} games${liveN ? `, ${liveN} live` : ''}</span></div>`;
      if (big) body += `<div class="prev-row"><span>Biggest game: ${teamChip(big.away)} <span class="note">@</span> ${teamChip(big.home)}</span><span class="when">${big.state === 'live' ? 'Live' : esc(fmtTime.format(new Date(big.tip)))}</span></div>`;
    }
    return `<div class="preview card">${body}<button type="button" class="linkbtn" data-goto="tonight">See all ${slate.length} games →</button></div>`;
  }

  function renderStandings() {
    const heads = headlines();
    const h = state.head % heads.length;
    let html = state.me == null ? whoCard() : '';
    html += `<button type="button" class="headline" id="headline" aria-label="Show the next headline"><span class="q">${esc(heads[h])}</span>
      <span class="dots" aria-hidden="true">${heads.map((_, i) => `<i class="${i === h ? 'on' : ''}"></i>`).join('')}</span></button>`;
    html += `<div class="board card" id="board">
      <div class="bhead"><span class="colhead">#</span><span class="colhead">Name</span><span class="colhead num">Pts</span><span class="colhead num">${DAYCOL.label}</span><span class="colhead num">Pct</span></div>
      ${ROWS.map(rowHtml).join('')}
    </div>
    <p class="note">Ranked by Pct, points per game your teams have played. Tap a name for your picks.</p>`;
    // Mornings lead with last night's recap; once today's games start, tonight comes first.
    const started = slate.some((g) => g.state === 'live' || g.state === 'final');
    html += started ? tonightPreview() + recapCard() : recapCard() + tonightPreview();
    html += brianCard();
    $('view-standings').innerHTML = html;
  }

  function recapCard() {
    const r = D.recap;
    if (!r) return '';
    return `<section class="sect card recap"><h3 class="eyebrow">Recap · ${esc(r.label)}</h3><h2>${esc(r.headline)}</h2>
      <ul class="recap-lines">${r.lines.map((line) => `<li>${esc(line)}</li>`).join('')}</ul></section>`;
  }

  // Nick's request: one line a day for Brian, from where Brian stood when the day began, so it
  // stays put while tonight's games play out.
  function brianCard() {
    const s = PEOPLE.findIndex((p) => p.name === 'Brian');
    if (s < 0) return '';
    const today = currentDay();
    const rec = records(FINALS.filter((g) => g.day < today));
    const r = table(rec).find((x) => x.s === s);
    const lines = [
      'It’s not how you start, Brian. It’s how you finish.',
      'Today’s affirmation for Brian: “My teams will win basketball games.”',
      'Deep breaths, Brian. The Race tab is not a heart monitor.',
      'Defense wins championships, Brian. So do good teams. You have six of those, allegedly.',
      'Today’s forecast for Brian: a 100% chance of potential.',
    ];
    if (r.picks.every((k) => k.side === 'W')) lines.push('Six W picks, zero L picks. Brian chose hope.');
    const playing = r.picks.filter((k) => slate.some((g) => g.home === k.team || g.away === k.team)).length;
    if (playing) lines.push(`${playing === 1 ? 'One of Brian’s teams plays' : `${playing} of Brian’s teams play`} today. The universe owes you one, Brian.`);
    let line = null;
    if (r.games) {
      const left = 82 * r.picks.length - r.games;
      const played = r.picks.filter((k) => k.gp);
      const best = played.reduce((a, b) => (b.vs > a.vs ? b : a));
      const worst = played.reduce((a, b) => (b.vs < a.vs ? b : a));
      const diff = r.pts - D.bots[s].reduce((a, [team, side]) => a + pickStats(rec, team, side).pts, 0);
      lines.push(`Brian, your teams have ${left} games left. That’s ${left} chances to be great.`);
      lines.push(`Brian is at ${fmtPct(r)}. Every legend has a ${fmtPct(r)} chapter.`);
      if (best.w) lines.push(`Brian, the ${TEAMS[best.team].name} are ${best.w}-${best.l}. Be more like the ${TEAMS[best.team].name}.`);
      if (worst !== best && worst.vs < 0) lines.push(`The ${TEAMS[worst.team].name} are ${worst.w}-${worst.l}. This too shall pass, Brian.`);
      if (diff < 0) lines.push(`BrianBot is up ${-diff}. Rise up against the machine, Brian.`);
      if (diff > 0) lines.push(`Brian leads BrianBot by ${diff}. Humanity thanks you, Brian.`);
      if (r.rank === NP) lines.push('Last place is just first place from a different angle, Brian.');
      if (r.rank === 2) lines.push('Brian is one spot from the top. Visualize it, Brian.');
      if (r.rank === 1) line = r.tied ? 'Brian is tied for first. Halfway to glory. Keep going, Brian.' : 'Brian is in first place. The aspiration has become reality. Stay humble, Brian.';
    }
    const day = Math.round(Date.parse(today + 'T12:00:00Z') / 864e5);
    return `<section class="sect card aspire"><h3 class="eyebrow">Daily words of aspiration for Brian</h3><p>${esc(line || lines[day % lines.length])}</p></section>`;
  }

  /* FLIP: re-render, then slide rows from where they were to where they are. */
  function withRowMotion(render) {
    const board = $('board');
    const before = new Map();
    if (board) for (const el of board.querySelectorAll('.prow')) before.set(el.dataset.key, el.getBoundingClientRect().top);
    render();
    if (reduceMotion || !before.size) return;
    for (const el of $('board').querySelectorAll('.prow')) {
      const dy = before.get(el.dataset.key) - el.getBoundingClientRect().top;
      if (dy) el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
  }

  /* ---------- tonight ---------- */
  function gameStatus(g) {
    if (g.state === 'live') return `<span class="gstatus"><i class="live-dot"></i>${esc(g.clock || 'Live')}</span>`;
    if (g.state === 'final') return '<span class="gstatus">Final</span>';
    const spr = spreadText(g);
    return `<span class="gstatus">${esc(fmtTime.format(new Date(g.tip)))}${spr ? ` <span class="spr">${esc(spr)}</span>` : ''}</span>`;
  }

  const periodLabel = (i) => (i < 4 ? String(i + 1) : i === 4 ? 'OT' : `${i - 3}OT`);

  // Who scores if `winner` beats `loser`; `won` once it has.
  function outcomeRow(winner, loser, won) {
    const who = outcomePicks(winner, loser).flatMap((p, s) => (p.length ? [personChip(s, p, won)] : []));
    return `<div class="oc"><span>${esc(winner)} win</span><div class="chips">${who.length ? who.join('') : '<span class="nobody">Nobody</span>'}</div></div>`;
  }

  function gameCard(g, big) {
    const st = stakes(g);
    const mine = state.me != null && state.me >= 0 && (st.away[state.me] || st.home[state.me]);
    const done = g.state === 'final' && g.score;
    const homeWon = done && g.score[1] > g.score[0];
    const lead = (side) => g.score && g.state !== 'pre' && g.score[side] > g.score[1 - side];
    // Once the game is on, each row shows points per quarter (all four, plus any overtimes).
    const per = g.lines ? Math.max(4, g.lines[0].length, g.lines[1].length) : 0;
    const cells = (f) => Array.from({ length: per }, (_, i) => `<i>${f(i)}</i>`).join('');
    const ball = liveBall(g), chance = liveWin(g, ball);
    const teamRow = (t, side) => `<div class="tl${lead(side) ? ' lead' : ''}">${teamChip(t)}<span class="tn">${per ? '' : esc(TEAMS[t].city) + ' '}${esc(TEAMS[t].name)}${ball === side ? '<i class="ball" title="Has the ball"></i>' : ''}</span>
      ${per ? `<span class="qs">${cells((i) => (Number.isFinite(g.lines[side][i]) ? g.lines[side][i] : ''))}</span>` : ''}<span class="sc">${g.score && g.state !== 'pre' ? g.score[side] : ''}</span></div>`;
    const head = per ? `<div class="tl qh" aria-hidden="true"><span class="tn"></span><span class="qs">${cells(periodLabel)}</span><span class="sc">T</span></div>` : '';
    const stars = (g.stars || []).map((p, i) => (p ? `<span><b>${[g.away, g.home][i]}</b>${esc(p.name)} <em>${esc(p.line)}</em></span>` : '')).join('');
    const foot = g.state === 'pre' ? '' : `<button type="button" class="gfoot" data-box="${esc(g.id)}"><span class="stars">${stars}</span><span class="more">Box score ›</span></button>`;
    const have = summaries.get(g.id);
    const tale = g.state === 'pre' ? '' : gameStory(storyView(g, have && have.data), 2);
    const tags = [big ? `<span class="tag big">Biggest game · moves odds ${Math.max(1, Math.round(g.leverage))} pts</span>` : '', st.tag && st.tag !== 'No stakes' ? `<span class="tag">${st.tag}</span>` : '']
      .filter(Boolean).join('');
    return `<article class="game card${mine ? ' mine' : ''}"${g.state === 'pre' ? '' : ` data-box="${esc(g.id)}"`}>
      <div class="gtop"><div class="tags">${tags || (st.tag ? `<span class="tag">${st.tag}</span>` : '')}</div>${gameStatus(g)}</div>
      <div class="teams">${head}${teamRow(g.away, 0)}${teamRow(g.home, 1)}</div>
      ${chance == null ? '' : winBar(g.away, g.home, chance)}
      ${tale ? `<p class="story">${esc(tale)}</p>` : ''}
      ${outcomeRow(g.away, g.home, done && !homeWon)}${outcomeRow(g.home, g.away, done && homeWon)}
      ${foot}
    </article>`;
  }

  // Tonight's games in order: your saved order first (skipped for the usual order), then the biggest game, live, upcoming, finished.
  function tonightOrder(useSaved = true) {
    const big = bigGame();
    const yours = useSaved ? savedOrder(currentDay()) : [];
    const at = (g) => (yours.includes(g.id) ? yours.indexOf(g.id) : 1e9);
    const rank = (g) => (g === big ? 0 : g.state === 'live' ? 1 : g.state === 'pre' ? 2 : 3);
    return slate.slice().sort((a, b) => at(a) - at(b) || rank(a) - rank(b) || new Date(a.tip) - new Date(b.tip));
  }

  function renderTonight() {
    if (drag) return;  // never redraw under a finger; the drop redraws
    $('pager').classList.toggle('locked', !!reorder && state.tab === 'tonight');  // no swiping off to another tab mid-reorder
    if (reorder) return renderReorder();
    const big = bigGame();
    const day = currentDay();
    const list = tonightOrder();
    const liveN = slate.filter((g) => g.state === 'live').length;
    const finalN = slate.filter((g) => g.state === 'final').length;
    const yours = savedOrder(day).length > 0;
    const order = slate.length < 2 ? '' : `<button type="button" class="btn ghost slim" data-reorder="start">${ICON.order}Reorder</button>`;
    let html = `<div class="tonight-head"><div><h2>${slate.length ? 'Tonight' : 'No games today'}</h2><p>${esc(isoDay(day))}${slate.length ? ` · ${slate.length} games` : ''}${liveN ? ` · ${liveN} live` : ''}${finalN ? ` · ${finalN} final` : ''}${yours ? ' · your order' : ''}</p></div>${order}</div>`;
    if (!slate.length) {
      $('view-tonight').innerHTML = html + nextUpCard();
      return;
    }
    if (state.me != null && state.me >= 0) {
      const { needs, max } = myNight(state.me);
      const why = needs.filter((n) => n.team).map((n) => `${n.team} for your ${andList(n.picks)}`);
      const done = myDay(state.me), left = slate.some((g) => g.state !== 'final');
      // Once your games are over, how the night went; before that, what you need.
      html += needs.length ? `<div class="need card"><b>You need ${esc(andList(needs.map((n) => n.team || 'either')))}</b><span>Up to +${max} tonight${why.length ? ': ' + esc(why.join(', ')) : ''}</span></div>`
        : done.length ? `<div class="need card"><b>Your night: +${done.filter((r) => r.got).length}</b><span>${esc(done.map((r) => `${r.pick} ${r.got ? '+1' : 'missed'}`).join(' · '))}</span></div>`
          : `<div class="need card"><b>None of your teams play ${left ? 'tonight' : 'today'}</b><span>Kick back and root for chaos.</span></div>`;
    }
    html += list.map((g) => gameCard(g, g === big)).join('');
    if (liveOk === false) html += '<p class="note">Live scores are unavailable right now. Finals still arrive within about 15 minutes.</p>';
    if (!slate.some((g) => g.state !== 'final')) html += nextUpCard();  // tonight is done: what's next
    $('view-tonight').innerHTML = html;
  }

  /* ---------- your order for tonight's games ----------
     Kept on this phone for the day. The Reorder button turns every game into one thin row under a pinned
     bar. Tap a row to pick it and move it with the arrows as many times as you like, or drag a row by the
     handle on its right: the others slide out of its way, and the list scrolls near the top or bottom.
     Nothing is kept until Save order; Cancel puts everything back. */
  function savedOrder(day) {
    try {
      const o = JSON.parse(store.get('wl-order') || 'null');
      return o && o.day === day && Array.isArray(o.ids) ? o.ids : [];
    } catch (e) { return []; }
  }
  const saveOrder = (day, ids) => store.set('wl-order', JSON.stringify({ day, ids }));
  let reorder = null;  // while reordering: { day, ids in their new order, sel: the picked game }
  let press = null, drag = null, droppedAt = 0;

  function renderReorder() {
    const r = reorder;
    if (r.day !== currentDay()) { reorder = null; return renderTonight(); }  // the slate moved on to a new day
    const byId = new Map(slate.map((g) => [g.id, g]));
    r.ids = r.ids.filter((id) => byId.has(id));
    for (const g of tonightOrder()) if (!r.ids.includes(g.id)) r.ids.push(g.id);
    const at = r.ids.indexOf(r.sel), last = r.ids.length - 1;
    if (at < 0) r.sel = null;
    const move = (how, label, off) => `<button type="button" data-move="${how}"${off ? ' disabled' : ''}>${ICON[how]}${label}</button>`;
    const picked = r.sel != null;
    $('view-tonight').innerHTML = `<div class="rbar">
        <div class="rbar-top"><button type="button" class="linkbtn" data-reorder="cancel">Cancel</button><b>Reorder games</b><button type="button" class="btn slim" data-reorder="save">Save order</button></div>
        <div class="rmoves">${move('top', 'Top', !picked || at === 0)}${move('up', 'Up', !picked || at === 0)}${move('down', 'Down', !picked || at === last)}${move('bottom', 'Bottom', !picked || at === last)}</div>
      </div>
      <div class="rhint"><p class="note">${picked ? 'Move it with the arrows. Tap it again to let go.' : `Tap a game, then use the arrows. Or drag it by ${HANDLE}`}</p><button type="button" class="linkbtn" data-reorder="reset">Reset</button></div>
      <div class="rlist">${r.ids.map((id) => reorderRow(byId.get(id))).join('')}</div>`;
  }

  // One game as a thin row: the teams (your picks marked), the time or score, and the drag handle.
  function reorderRow(g) {
    const me = state.me != null && state.me >= 0 ? state.me : null;
    const yours = (t) => ['W', 'L'].filter((sd) => me != null && OWN[sd][t] === me);
    const team = (t) => teamChip(t) + yours(t).map((sd) => `<span class="yours">${sd}</span>`).join('');
    const status = g.state === 'pre' ? esc(fmtTime.format(new Date(g.tip)))
      : `${g.state === 'live' ? '<i class="live-dot"></i>' : ''}${g.score ? `${g.score[0]}–${g.score[1]}` : ''}<small>${esc(g.state === 'final' ? 'Final' : g.clock || '')}</small>`;
    const mine = yours(g.away).length || yours(g.home).length, sel = reorder.sel === g.id;
    return `<button type="button" class="rrow${mine ? ' mine' : ''}${sel ? ' sel' : ''}" data-row="${esc(g.id)}" aria-pressed="${sel}">
      <span class="rteams">${team(g.away)}<span class="at">@</span>${team(g.home)}</span><span class="rst">${status}</span><span class="rgrip" aria-hidden="true">${HANDLE}</span></button>`;
  }

  // Redraw (and maybe scroll), then slide each row from where it was in the list to where it now is.
  function slideRows(render, then) {
    const sc = $('page-tonight'), at = (c) => c.getBoundingClientRect().top + sc.scrollTop;  // place in the list, whatever the scroll
    const was = new Map([...viewTonight.querySelectorAll('.rrow')].map((c) => [c.dataset.row, at(c)]));
    render();
    if (then) then();  // before the slide starts, so it measures where rows really are
    if (reduceMotion) return;
    for (const c of viewTonight.querySelectorAll('.rrow')) {
      const dy = was.has(c.dataset.row) ? was.get(c.dataset.row) - at(c) : 0;
      if (dy) c.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 200, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
  }

  // Scroll just enough that the picked game sits clear of the pinned bar and the bottom edge.
  function keepInView(focus) {
    const row = viewTonight.querySelector('.rrow.sel'), bar = viewTonight.querySelector('.rbar');
    if (!row || !bar) return;
    const sc = $('page-tonight'), b = row.getBoundingClientRect();
    const top = bar.getBoundingClientRect().bottom + 8, bottom = sc.getBoundingClientRect().bottom - 8;
    if (b.top < top) sc.scrollTop -= top - b.top;
    else if (b.bottom > bottom) sc.scrollTop += b.bottom - bottom;
    if (focus) row.focus({ preventScroll: true });
  }

  function moveSel(how, focus) {
    const r = reorder, i = r.ids.indexOf(r.sel);
    if (i < 0) return;
    const j = Math.max(0, Math.min(r.ids.length - 1, how === 'top' ? 0 : how === 'bottom' ? r.ids.length - 1 : i + (how === 'up' ? -1 : 1)));
    slideRows(() => {
      r.ids.splice(j, 0, r.ids.splice(i, 1)[0]);
      renderTonight();
    }, () => keepInView(focus));
  }

  function reorderAct(what) {
    const day = currentDay();
    if (what === 'start') {
      reorder = { day, ids: tonightOrder().map((g) => g.id), sel: null };
      renderTonight();
      $('page-tonight').scrollTop = 0;
      return;
    }
    if (!reorder) return;
    if (what === 'reset') {  // the usual order: the biggest game, then live, upcoming, finished
      return slideRows(() => {
        reorder.ids = tonightOrder(false).map((g) => g.id);
        renderTonight();
      });
    }
    if (what === 'save') {
      const ids = reorder.ids;
      if (ids.join() === tonightOrder(false).map((g) => g.id).join()) store.set('wl-order', '');  // same as the usual order: keep following it
      else {
        saveOrder(day, ids);
        toast('Order saved for today');
      }
    }
    reorder = null;  // saved or cancelled: back to the full cards, from the top
    renderTonight();
    $('page-tonight').scrollTop = 0;
  }

  function dragTo(y) {
    const d = drag, sc = $('page-tonight');
    const dy = y - d.y0 + (sc.scrollTop - d.s0);
    d.row.style.transform = `translateY(${dy}px)`;
    const mid = d.mids[d.from] + dy;  // where the lifted row's middle is now, among the others' middles
    let to = d.from;
    while (to > 0 && mid < d.mids[to - 1]) to--;
    while (to < d.rows.length - 1 && mid > d.mids[to + 1]) to++;
    if (to === d.to) return;
    d.to = to;
    d.rows.forEach((c, i) => {
      if (c === d.row) return;
      const shift = d.from < i && i <= to ? -d.room : to <= i && i < d.from ? d.room : 0;
      c.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  }
  function dragScroll() {  // near the top or bottom of the list, scroll it along
    if (!drag) return;
    const sc = $('page-tonight'), r = sc.getBoundingClientRect(), bar = viewTonight.querySelector('.rbar');
    const top = (bar ? bar.getBoundingClientRect().bottom : r.top) + 40, bottom = r.bottom - 56;
    const v = drag.y < top ? -(top - drag.y) / 5 : drag.y > bottom ? (drag.y - bottom) / 5 : 0;
    if (v) {
      const before = sc.scrollTop;
      sc.scrollTop += v;
      if (sc.scrollTop !== before) dragTo(drag.y);
    }
    drag.raf = requestAnimationFrame(dragScroll);
  }
  function dragStart(p, e) {
    const list = viewTonight.querySelector('.rlist');
    const rows = list ? [...list.querySelectorAll('.rrow')] : [];
    const row = rows.find((c) => c.dataset.row === p.row);  // looked up again: a live update may have redrawn the list
    if (!row) return;
    drag = {
      row, rows, list, from: rows.indexOf(row), to: rows.indexOf(row), id: p.id, raf: 0, y0: p.y0, y: e.clientY, s0: $('page-tonight').scrollTop,  // from where the finger landed: the row stays under it
      mids: rows.map((c) => { const b = c.getBoundingClientRect(); return b.top + b.height / 2; }),
      room: row.getBoundingClientRect().height + (parseFloat(getComputedStyle(list).rowGap) || 6),
    };
    list.classList.add('sorting');
    row.classList.add('lifted');
    dragTo(e.clientY);
    drag.raf = requestAnimationFrame(dragScroll);
  }
  function dragEnd() {
    const d = drag;
    if (!d) return;
    cancelAnimationFrame(d.raf);
    drag = null;
    droppedAt = Date.now();
    slideRows(() => {
      if (reorder) {
        const ids = d.rows.map((c) => c.dataset.row);
        ids.splice(d.to, 0, ids.splice(d.from, 1)[0]);
        reorder.ids = ids;
        reorder.sel = d.row.dataset.row;  // stays picked, so the arrows can fine-tune it
      }
      renderTonight();  // in the new order, with anything that came in during the drag
    });
  }
  const viewTonight = $('view-tonight');
  viewTonight.addEventListener('pointerdown', (e) => {
    const grip = e.target.closest('.rgrip');
    if (!grip || !reorder || press || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
    press = { id: e.pointerId, x0: e.clientX, y0: e.clientY, row: grip.closest('.rrow').dataset.row };
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* the moves still reach the list */ }
  });
  viewTonight.addEventListener('pointermove', (e) => {
    if (drag && e.pointerId === drag.id) {
      drag.y = e.clientY;
      dragTo(e.clientY);
    } else if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x0, e.clientY - press.y0) > 6) {
      const p = press;  // moved: it's a drag, not a tap
      press = null;
      dragStart(p, e);
    }
  });
  for (const type of ['pointerup', 'pointercancel']) {
    viewTonight.addEventListener(type, (e) => {
      if (press && e.pointerId === press.id) press = null;  // never moved: a tap, which picks the row
      if (drag && e.pointerId === drag.id) dragEnd();
    });
  }
  // From the keyboard: the up and down arrow keys move the focused game one place.
  viewTonight.addEventListener('keydown', (e) => {
    const row = e.target.closest('.rrow');
    if (!row || !reorder || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    reorder.sel = row.dataset.row;
    moveSel(e.key === 'ArrowUp' ? 'up' : 'down', true);
  });

  // The next day with games, for when today has none or they're all over.
  function nextUpCard() {
    const ahead = upcoming().filter(([tip]) => !slate.some((g) => g.tip === tip));
    const first = ahead.length ? ahead[0][0] : null;
    if (!first) return '';
    const games = ahead.filter(([tip]) => dateKey(new Date(tip)) === dateKey(new Date(first)));
    return `<div class="sect card"><h2>Next up, ${esc(fmtWeekday.format(new Date(first)))}</h2><div class="ahead-list">${games.map(([tip, a, h]) => `<div><span>${teamChip(a)} <span class="note">@</span> ${teamChip(h)}</span><span class="note">${esc(fmtTime.format(new Date(tip)))}</span></div>`).join('')}</div></div>`;
  }

  // How your picks did in today's finished games.
  function myDay(me) {
    const out = [];
    for (const g of slate) {
      if (g.state !== 'final' || !g.score) continue;
      const winner = g.score[1] > g.score[0] ? g.home : g.away;
      for (const t of [g.away, g.home]) {
        for (const side of ['W', 'L']) if (OWN[side][t] === me) out.push({ pick: `${t} ${side}`, got: (side === 'W') === (t === winner) });
      }
    }
    return out;
  }

  /* ---------- race chart ---------- */
  const METRICS = [
    { key: 'pct', label: 'Pct', help: 'Winning percentage, points per game your teams have played: what the standings rank by. The first days swing wildly, so the chart zooms in on recent weeks.' },
    { key: 'vegas', label: 'vs Vegas', help: 'Wins above or below what the preseason lines expected by now. Zero is exactly on pace.' },
    { key: 'points', label: 'Points', help: 'Total points: wins on W picks plus losses on L picks.' },
    { key: 'odds', label: 'Odds', help: 'Chance to finish first, re-simulated after every day of games.' },
    { key: 'rank', label: 'Rank', help: 'Place in the standings after each day, ranked by Pct like the front page.' },
  ];

  function niceStep(raw) {
    if (!(raw > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }

  const pct3 = (v) => (v == null ? '–' : v >= 1 ? '1.000' : v.toFixed(3).slice(1));

  function chartSpec(metric) {
    if (metric === 'pct') {
      // Zoom on the later part of the season so far; the wild first days get clamped to the edges.
      const vals = D.series.pct;
      const settled = vals.slice(Math.max(1, Math.floor(vals.length / 4))).flat().filter((v) => v != null);
      const pool = settled.length ? settled : [0.5];
      const step = niceStep(Math.max(Math.max(...pool) - Math.min(...pool), 0.1) / 4);
      const bottom = Math.max(0, Math.floor((Math.min(...pool) - 0.01) / step) * step);
      const top = Math.min(1, Math.ceil((Math.max(...pool) + 0.01) / step) * step);
      const ticks = [];
      for (let v = bottom; v <= top + 1e-9; v += step) ticks.push(Number(v.toFixed(6)));
      return { vals, top, bottom, ticks, tick: pct3, val: pct3, clamp: true };
    }
    const S = D.series[metric];
    const vals = metric === 'odds' ? S.map((r) => r.map((v) => v * 100)) : S;
    const flat = vals.flat();
    if (metric === 'rank') return { vals, top: 0.6, bottom: 5.4, ticks: [1, 2, 3, 4, 5], tick: (v) => ordinal(v), val: (v) => ordinal(v) };
    if (metric === 'odds') return { vals, top: 100, bottom: 0, ticks: [0, 25, 50, 75, 100], tick: (v) => v + '%', val: (v) => pct(v / 100) };
    if (metric === 'points') {
      const mx = Math.max(4, ...flat);
      const step = niceStep(mx / 4);
      const top = Math.ceil(mx / step) * step;
      const ticks = [];
      for (let v = 0; v <= top + 1e-9; v += step) ticks.push(Number(v.toFixed(6)));
      return { vals, top, bottom: 0, ticks, tick: (v) => String(v), val: (v) => String(v) };
    }
    const m = Math.max(1, ...flat.map(Math.abs));
    const step = niceStep(m / 2);
    const top = Math.ceil(m / step) * step;
    const ticks = [];
    for (let v = -top; v <= top + 1e-9; v += step) ticks.push(Number(v.toFixed(6)));
    return { vals, top, bottom: -top, ticks, tick: (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v), val: (v) => signed(v), zero: true };
  }

  let chart = null;  // geometry of the drawn chart, for scrubbing

  function drawChart() {
    const host = $('chart');
    if (!host) return;
    const spec = chartSpec(state.metric);
    const N = spec.vals.length;
    const W = Math.max(280, Math.round(host.clientWidth - 8) || 340);
    const H = 236;
    const m = { l: 34, r: 100, t: 10, b: 24 };  // the right margin holds the end labels
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const x = (i) => m.l + (i / (N - 1)) * pw;
    const y = (v) => m.t + ((spec.top - (spec.clamp ? clamp(v, spec.bottom, spec.top) : v)) / (spec.top - spec.bottom)) * ph;
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(METRICS.find((k) => k.key === state.metric).label)} by day for all five players">`;
    for (const t of spec.ticks) {
      svg += `<line class="${spec.zero && t === 0 ? 'zl' : 'gl'}" x1="${m.l}" x2="${m.l + pw}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`;
      svg += `<text class="ax" x="${m.l - 6}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${esc(spec.tick(t))}</text>`;
    }
    D.days.slice(0, N).forEach((d, i) => {
      if (i > 0 && d.endsWith('-01')) {
        svg += `<line class="gl" x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${m.t + ph}" y2="${m.t + ph + 4}"/>`;
        svg += `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(fmtMonth.format(new Date(d + 'T12:00:00Z')))}</text>`;
      }
    });
    const dimmed = (s) => (state.focus != null && state.focus !== s ? ' dim' : '');
    for (let s = 0; s < NP; s++) {
      let path = '', pen = false;  // a day without a value (no games yet) breaks the line
      spec.vals.forEach((row, i) => {
        if (row[s] == null) { pen = false; return; }
        path += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(row[s]).toFixed(1)}`;
        pen = true;
      });
      if (path) svg += `<path class="ln${dimmed(s)}" style="stroke:var(--p${s + 1})" d="${path}"/>`;
    }
    // End labels with leader lines, spaced so they never overlap.
    const ends = [];
    PEOPLE.forEach((_, s) => {
      for (let i = N - 1; i >= 0; i--) {
        if (spec.vals[i][s] != null) { ends.push({ s, i, v: spec.vals[i][s], y: y(spec.vals[i][s]) }); break; }
      }
    });
    ends.sort((a, b) => a.y - b.y);
    const gap = 15;
    ends.forEach((e, k) => { e.ly = Math.max(e.y, k ? ends[k - 1].ly + gap : m.t + 4); });
    const over = ends.length ? ends[ends.length - 1].ly - (m.t + ph) : 0;
    if (over > 0) for (let k = ends.length - 1; k >= 0; k--) ends[k].ly = Math.min(ends[k].ly - over, k < ends.length - 1 ? ends[k + 1].ly - gap : Infinity);
    const xe = x(N - 1), xl = xe + 22;
    for (const e of ends) {
      const xd = x(e.i);
      svg += `<path class="ld${dimmed(e.s)}" d="M${xd + 6},${e.y.toFixed(1)} L${xl - 4},${e.ly.toFixed(1)}"/>`;
      svg += `<line class="${dimmed(e.s).trim()}" x1="${xl}" x2="${xl + 10}" y1="${e.ly.toFixed(1)}" y2="${e.ly.toFixed(1)}" style="stroke:var(--p${e.s + 1});stroke-width:2;stroke-linecap:round"/>`;
      svg += `<text class="lbl${dimmed(e.s)}" x="${xl + 14}" y="${(e.ly + 4).toFixed(1)}">${esc(PEOPLE[e.s].name)} <tspan class="v">${esc(spec.val(e.v))}</tspan></text>`;
      svg += `<circle class="ring${dimmed(e.s)}" cx="${xd.toFixed(1)}" cy="${e.y.toFixed(1)}" r="4" style="fill:var(--p${e.s + 1})"/>`;
    }
    svg += `<g id="cross" visibility="hidden"><line class="cx" id="crossLine" y1="${m.t}" y2="${m.t + ph}"/>`;
    for (let s = 0; s < NP; s++) svg += `<circle class="ring" id="crossDot${s}" r="4" style="fill:var(--p${s + 1})"/>`;
    svg += `</g><rect id="hit" x="${m.l - 8}" y="0" width="${pw + 16}" height="${H}" fill="transparent"/></svg>`;
    host.innerHTML = svg;
    chart = { spec, N, W, x, y, m, pw };
    setScrub(state.scrub);
    renderReadout();
  }

  function setScrub(i) {
    if (!chart) return;
    state.scrub = i == null ? null : clamp(i, 0, chart.N - 1);
    const g = document.getElementById('cross');
    if (!g) return;
    if (state.scrub == null) { g.setAttribute('visibility', 'hidden'); renderReadout(); return; }
    const xi = chart.x(state.scrub).toFixed(1);
    const line = document.getElementById('crossLine');
    line.setAttribute('x1', xi);
    line.setAttribute('x2', xi);
    for (let s = 0; s < NP; s++) {
      const dot = document.getElementById('crossDot' + s);
      const v = chart.spec.vals[state.scrub][s];
      dot.setAttribute('visibility', v == null ? 'hidden' : 'inherit');
      if (v == null) continue;
      dot.setAttribute('cx', xi);
      dot.setAttribute('cy', chart.y(v).toFixed(1));
    }
    g.setAttribute('visibility', 'visible');
    renderReadout();
  }

  const dayLabel = (i) => (i === 0 ? 'Draft day' : isoDay(D.days[i]));

  function renderReadout() {
    const el = $('readout');
    if (!el || !chart) return;
    const i = state.scrub == null ? chart.N - 1 : state.scrub;
    const row = chart.spec.vals[i];
    const key = (s) => (row[s] == null ? -Infinity : state.metric === 'rank' ? -row[s] : row[s]);
    const order = PEOPLE.map((_, s) => s).sort((a, b) => (key(b) - key(a)) || 0);
    el.innerHTML = `<div class="rd-date">${esc(dayLabel(i))}${state.scrub == null ? ' · latest full day' : ''}</div>
      <div class="rd-items">${order.map((s) => `<span class="ri" style="${pc(s)}"><i></i><b>${esc(chart.spec.val(row[s]))}</b>${esc(PEOPLE[s].name)}</span>`).join('')}</div>`;
  }

  function raceTable() {
    const spec = chartSpec(state.metric);
    const idx = [];
    for (let i = 0; i < spec.vals.length; i += 7) idx.push(i);
    if (idx[idx.length - 1] !== spec.vals.length - 1) idx.push(spec.vals.length - 1);
    return `<div class="tblwrap"><table><thead><tr><th>Date</th>${PEOPLE.map((p) => `<th>${esc(p.name)}</th>`).join('')}</tr></thead><tbody>
      ${idx.map((i) => `<tr><td>${esc(dayLabel(i))}</td>${spec.vals[i].map((v) => `<td>${esc(spec.val(v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  function momentsHtml() {
    if (!D.moments.length) return '<p class="empty card">No moments yet. Lead changes, big nights and 0-for-4 nights will show up here.</p>';
    return `<ol class="moments card">${D.moments.map(([i, text]) => `<li><button type="button" data-day="${i}"><span class="md">${esc(dayLabel(i))}</span><span>${esc(text)}</span></button></li>`).join('')}</ol>`;
  }

  // Ryan's request: who wins, by the betting market's current win totals.
  function vegasCard() {
    if (!D.market) return '';
    const rows = PEOPLE.map((p, s) => ({ s, name: p.name, proj: D.projNow[s], odds: D.oddsNow[s], was: D.series.odds[0][s] })).sort((a, b) => b.odds - a.odds);
    return `<section class="sect card"><h2>Vegas prediction</h2>
      <div><div class="vrow vhd"><span class="colhead">Player</span><span class="colhead num">Proj</span><span class="colhead num">Odds</span><span class="colhead num">Draft</span></div>
      ${rows.map((v) => `<div class="vrow"><span class="nm"><i class="dot" style="${pc(v.s)}"></i><b>${esc(v.name)}</b></span><span class="num">${Math.round(v.proj)}</span><span class="num odds">${pct(v.odds)}</span><span class="num was">${pct(v.was)}</span></div>`).join('')}</div>
      <p class="note">Odds: chance of finishing first. Proj: expected final points. Both come from each team's win total on Kalshi's betting market (${esc(isoDay(D.market.asOf))}) and ${(D.meta.model.simsNow || 12000).toLocaleString()} simulated seasons; tonight's results count once they're final. Draft: title odds on draft day.</p></section>`;
  }

  function renderRace() {
    const N = D.series.points.length;
    if (N < 2) {
      chart = null;
      $('view-race').innerHTML = `<div class="sect card"><h2>The race starts tomorrow</h2>
        <p>The chart begins after the first full day of games. It tracks everyone against the Vegas lines, total points, title odds and rank, one point per day.</p>
        <p class="note">On draft day the title odds were ${PEOPLE.map((p, s) => `${esc(p.name)} ${pct(D.series.odds[0][s])}`).join(', ')}.</p></div>
        ${vegasCard()}<h3 class="eyebrow">Moments</h3>${momentsHtml()}`;
      return;
    }
    const metrics = METRICS.filter((k) => D.series[k.key]);  // an older data.json may lack Pct
    if (!metrics.some((k) => k.key === state.metric)) state.metric = metrics[0].key;
    const metric = METRICS.find((k) => k.key === state.metric);
    $('view-race').innerHTML = `
      <div class="seg" role="tablist" aria-label="What to chart">${metrics.map((k) => `<button type="button" role="tab" aria-selected="${k.key === state.metric}" data-metric="${k.key}">${k.label}</button>`).join('')}</div>
      <p class="mhelp">${esc(metric.help)}</p>
      <div class="legend${state.focus != null ? ' focusing' : ''}" aria-label="Players">${PEOPLE.map((p, s) => `<button type="button" class="lg${state.focus === s ? ' on' : ''}" data-focus="${s}" aria-pressed="${state.focus === s}" style="${pc(s)}"><i></i>${esc(p.name)}</button>`).join('')}</div>
      <div class="chart card" id="chart" tabindex="0" aria-describedby="readout"></div>
      <div class="readout card" id="readout" aria-live="polite"></div>
      <p class="note">Drag across the chart to move through the season. Tap a name to pick out one line. Tonight's games join the chart once the day is over.</p>
      <details class="tbl" data-keep="tbl"${opened.has('tbl') ? ' open' : ''}><summary>Show as a table</summary>${raceTable()}</details>
      ${vegasCard()}
      <h3 class="eyebrow">Moments</h3>${momentsHtml()}
      ${N >= 3 ? '<button type="button" class="btn ghost" id="replayBtn"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0.5l8 4.5-8 4.5z"/></svg>Replay the season</button>' : ''}`;
    drawChart();
  }

  function scrubFromEvent(e) {
    const svg = $('chart') && $('chart').querySelector('svg');
    if (!svg || !chart) return;
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) * (chart.W / r.width);
    setScrub(Math.round(((px - chart.m.l) / chart.pw) * (chart.N - 1)));
  }

  /* ---------- draft ---------- */
  function shadeClass(vs, gp) {
    if (!gp) return '';
    const a = Math.abs(vs / Math.sqrt(gp * 0.25));
    const step = a < 0.25 ? 0 : a < 0.55 ? 1 : a < 0.85 ? 2 : 3;
    return step ? `sh-${vs > 0 ? 'p' : 'n'}${step}` : '';
  }

  function renderDraft() {
    let html = '<h3 class="eyebrow">Draft board</h3><div class="dboard" role="group" aria-label="Draft board, rounds by player"><span></span>';
    html += PEOPLE.map((p, s) => `<div class="bh"><i class="dot" style="${pc(s)}"></i>${esc(p.name)}</div>`).join('');
    for (let r = 0; r < PEOPLE[0].picks.length; r++) {
      html += `<div class="br">${r + 1}</div>`;
      for (let s = 0; s < NP; s++) {
        const k = rowOf(s).picks[r];
        html += `<button type="button" class="cell ${shadeClass(k.vs, k.gp)}" data-team="${k.team}" data-side="${k.side}" aria-label="${esc(PEOPLE[s].name)}: ${k.team} ${k.side}, ${k.pts} points, ${signed(k.vs)} versus Vegas">
          <b>${k.team} ${k.side}</b><small>${k.pts} · ${signed(k.vs)}</small></button>`;
      }
    }
    html += `</div><div class="shade-key"><span>Behind Vegas</span><i class="sh-n3"></i><i class="sh-n2"></i><i class="sh-n1"></i><i></i><i class="sh-p1"></i><i class="sh-p2"></i><i class="sh-p3"></i><span>Ahead</span></div>`;

    const bots = botTable().sort((a, b) => b.diff - a.diff);
    html += `<section class="sect card"><h2>Beat the bot</h2>
      <p>Each bot drafted from your slot and always took whatever the Vegas lines rated highest. On draft day the bots projected ${D.bots.map((b) => Math.round(b.reduce((a, [t, sd]) => a + lineValue(t, sd), 0))).join(', ')} in draft order.</p>
      <div><div class="botrow bhd"><span class="colhead">Player</span><span class="colhead num">You</span><span class="colhead num">Bot</span><span class="colhead num">+/−</span></div>
      ${bots.map((b) => `<button type="button" class="botrow" data-bot="${b.s}" aria-expanded="${state.botOpen === b.s}">
        <span class="nm"><i class="dot" style="${pc(b.s)}"></i><b>${esc(b.name)}</b></span>
        <span class="num">${b.mine}</span><span class="num">${b.bot}</span><span class="num diff">${b.diff > 0 ? '+' : b.diff < 0 ? '−' : ''}${Math.abs(b.diff)}</span></button>
        ${state.botOpen === b.s ? `<div class="botpicks"><span class="note">${esc(b.name)}Bot took:</span>${b.picks.map((k) => `<span><b>${k.team} ${k.side}</b> ${k.pts}</span>`).join('')}</div>` : ''}`).join('')}</div>
    </section>`;

    if (OWN.W.POR != null && OWN.L.POR != null) {
      const w = REC.POR.w, l = REC.POR.l, sw = OWN.W.POR, sl = OWN.L.POR;
      const [nx] = nextGames('POR', 1);
      html += `<section class="sect card"><h2>Portland civil war</h2>
        <div class="cw"><div class="cw-side"><b>${w}</b>${esc(PEOPLE[sw].name)} (W)</div>
          <div class="cwbar" aria-hidden="true">${w + l ? `<i style="${pc(sw)};flex:${w || 0.0001}"></i><i style="${pc(sl)};flex:${l || 0.0001}"></i>` : `<i style="${pc(sw)};flex:1"></i><i style="${pc(sl)};flex:1"></i>`}</div>
